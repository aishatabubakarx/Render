<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rising Hearts Preview 15s</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #cfd8e3; --line: rgba(255,255,255,.18); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; opacity: .55; transition: opacity .2s; }
  .bar:hover { opacity: 1; }
  button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>
<script>
(function () {
  var DUR = 15;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var seed = 20261115;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  var palette = [
    [255, 92, 140],   // rose
    [255, 128, 170],  // pink
    [255, 70, 100],   // red-pink
    [255, 170, 200],  // light pink
    [235, 60, 120]    // deep rose
  ];

  var hearts = [];
  var N = 70;
  for (var i = 0; i < N; i++) {
    var layer = rnd();                                         // 0 far, 1 near
    hearts.push({
      x: rnd(),
      phase: rnd(),
      cycles: layer > 0.65 ? 1 : (layer > 0.3 ? 2 : 3),        // integer cycles per 15s keeps the loop seamless
      size: 3.5 + layer * layer * 14,
      swayAmp: 8 + rnd() * 26,
      swayK: 1 + Math.floor(rnd() * 3),
      swayPh: rnd() * Math.PI * 2,
      rotAmp: 0.12 + rnd() * 0.2,
      twK: 5 + Math.floor(rnd() * 12),
      twPh: rnd() * Math.PI * 2,
      alpha: 0.4 + layer * 0.5,
      col: palette[Math.floor(rnd() * palette.length)]
    });
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.6, -s * 0.1, -s * 0.8, -s * 1.1, 0, -s * 0.35);
    ctx.bezierCurveTo(s * 0.8, -s * 1.1, s * 1.6, -s * 0.1, 0, s * 0.9);
    ctx.closePath();
  }

  function draw(t) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    var g = Math.max(0, Math.min(1, t / 1.0, (DUR - t) / 1.0));

    for (var i = 0; i < hearts.length; i++) {
      var h = hearts[i];
      var p = ((t / DUR) * h.cycles + h.phase) % 1;
      var m = h.size * 2.2;
      // rises from below the frame and keeps going past the top edge
      var y = H + m - p * (H + 2 * m);
      var x = h.x * W + Math.sin(2 * Math.PI * h.swayK * t / DUR + h.swayPh) * h.swayAmp;
      var rot = Math.sin(2 * Math.PI * h.swayK * t / DUR + h.swayPh + 1.3) * h.rotAmp;

      var env = Math.min(1, p / 0.08);                          // soft appearance at the bottom, full strength leaving the top
      var tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * h.twK * t / DUR + h.twPh);
      var a = h.alpha * env * (0.7 + 0.3 * tw) * g;
      if (a <= 0.004) continue;

      var c = h.col;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      // tight outer glow
      heartPath(h.size * 1.45);
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.12).toFixed(3) + ')';
      ctx.fill();

      // heart body
      heartPath(h.size);
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
      ctx.fill();

      // soft inner highlight at twinkle peak
      if (tw > 0.75) {
        var k = (tw - 0.75) / 0.25;
        heartPath(h.size * 0.55);
        ctx.fillStyle = 'rgba(255,225,235,' + (a * 0.4 * k).toFixed(3) + ')';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  var playing = true, tNow = 0, last = performance.now();
  var pp = document.getElementById('pp'), rs = document.getElementById('rs');
  var fill = document.getElementById('fill'), tm = document.getElementById('tm');

  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    draw(tNow);
    fill.style.width = (tNow / DUR * 100) + '%';
    tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
