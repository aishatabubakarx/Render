<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Ice Frame Preview 15s</title>
<style>
  :root { color-scheme: dark; --bg: #02050b; --fg: #cfd8e3; --line: rgba(255,255,255,.18); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; opacity: .55; transition: opacity .2s; z-index: 5; }
  .bar:hover { opacity: 1; }
  button { background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>
<script>
(function () {
  var DUR = 15, TAU = Math.PI * 2;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, U = 0;

  // seeded random so every play looks the same
  var seed = 20261121;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function rr(a, b) { return a + (b - a) * rnd(); }
  function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  var LAT = new Float32Array(256 * 256);
  for (var li = 0; li < LAT.length; li++) LAT[li] = rnd();
  function nz(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
    var x0 = xi & 255, y0 = yi & 255, x1 = (xi + 1) & 255, y1 = (yi + 1) & 255;
    var a = LAT[y0 * 256 + x0], b = LAT[y0 * 256 + x1], c = LAT[y1 * 256 + x0], d = LAT[y1 * 256 + x1];
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  }
  function fbm(x, y) {
    var v = 0, a = 0.5;
    for (var i = 0; i < 4; i++) { v += a * nz(x, y); x = x * 2.03 + 5.2; y = y * 2.03 + 1.3; a *= 0.5; }
    return v;
  }

  // irregular contour made of several sine waves with random phases
  function makeLump() {
    var c = [], sum = 0;
    for (var k = 0; k < 5; k++) {
      var o = { f: rr(0.004, 0.02) * (1 + k * 1.6), a: rr(0.4, 1) / (1 + k * 0.7), p: rr(0, TAU) };
      sum += o.a; c.push(o);
    }
    return function (x) {
      var s = 0;
      for (var k = 0; k < c.length; k++) s += c[k].a * Math.sin(x * c[k].f + c[k].p);
      return 0.5 + 0.5 * s / sum;
    };
  }

  var frameCv = null, tips = [], glints = [], drips = [];
  var mist = document.createElement('canvas'), mctx = mist.getContext('2d'), mimg = null, MW = 0, MH = 0;
  var flakes = [];

  function drawIcicle(f, x, y0, len, w, tilt, ph) {
    var N = 14, L = [], R = [], i;
    for (i = 0; i <= N; i++) {
      var s = i / N;
      var cx = x + tilt * len * s * s + Math.sin(s * 6 + ph) * w * 0.18 * s;
      var hw = w * Math.pow(1 - s, 0.85) * (0.8 + 0.2 * Math.sin(s * 10 + ph * 1.7)) + 0.35 * (1 - s);
      L.push([cx - hw, y0 + s * len]); R.push([cx + hw, y0 + s * len]);
    }
    f.beginPath();
    f.moveTo(L[0][0], L[0][1]);
    for (i = 1; i <= N; i++) f.lineTo(L[i][0], L[i][1]);
    for (i = N; i >= 0; i--) f.lineTo(R[i][0], R[i][1]);
    f.closePath();
    var g = f.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(80,128,190,0.55)');
    g.addColorStop(0.35, 'rgba(190,224,252,0.78)');
    g.addColorStop(0.5, 'rgba(240,250,255,0.9)');
    g.addColorStop(0.75, 'rgba(160,200,238,0.7)');
    g.addColorStop(1, 'rgba(70,115,182,0.5)');
    f.fillStyle = g; f.fill();

    // bright edge highlight and a dim core line give the ice some depth
    f.beginPath();
    for (i = 0; i <= N; i++) {
      var hx = L[i][0] + (R[i][0] - L[i][0]) * 0.26;
      if (i === 0) f.moveTo(hx, L[i][1]); else f.lineTo(hx, L[i][1]);
    }
    f.strokeStyle = 'rgba(255,255,255,0.5)'; f.lineWidth = Math.max(0.6, w * 0.11); f.stroke();
    f.beginPath();
    for (i = 0; i <= N; i++) {
      var dx = L[i][0] + (R[i][0] - L[i][0]) * 0.66;
      if (i === 0) f.moveTo(dx, L[i][1]); else f.lineTo(dx, L[i][1]);
    }
    f.strokeStyle = 'rgba(40,80,140,0.22)'; f.lineWidth = Math.max(0.5, w * 0.1); f.stroke();
  }

  function frost(f, x, y, ang, len, d) {
    if (len < 3 || d > 3) return;
    var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    f.moveTo(x, y); f.lineTo(x2, y2);
    var b = rr(0.35, 0.5);
    frost(f, x + (x2 - x) * b, y + (y2 - y) * b, ang + rr(0.6, 1.1), len * rr(0.35, 0.5), d + 1);
    frost(f, x + (x2 - x) * (b + 0.3), y + (y2 - y) * (b + 0.3), ang - rr(0.6, 1.1), len * rr(0.3, 0.45), d + 1);
    frost(f, x2, y2, ang + rr(-0.35, 0.35), len * rr(0.45, 0.65), d + 1);
  }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight; U = Math.min(W, H);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 20261121;

    frameCv = document.createElement('canvas');
    frameCv.width = cv.width; frameCv.height = cv.height;
    var f = frameCv.getContext('2d');
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    tips = []; glints = []; drips = [];

    var L1 = makeLump(), L2 = makeLump(), L3 = makeLump(), L4 = makeLump();
    var topCap = U * 0.085, sideCap = U * 0.05, botCap = U * 0.085, x, y, i;
    function yT(x) { return topCap * (0.45 + 0.9 * L1(x)) + topCap * 0.06 * Math.sin(x * 0.31 + 1.2); }
    function xL(y) { return sideCap * (0.4 + 0.9 * L2(y)) + sideCap * 0.08 * Math.sin(y * 0.27); }
    function xR(y) { return W - sideCap * (0.4 + 0.9 * L3(y)) - sideCap * 0.08 * Math.sin(y * 0.29 + 2); }
    function yB(x) { return H - botCap * (0.45 + 0.9 * L4(x)) - botCap * 0.06 * Math.sin(x * 0.23 + 0.6); }

    // snow masses
    function fillRegion(pathFn, g0, g1, c0, c1, gx0, gy0, gx1, gy1) {
      f.beginPath(); pathFn();
      var g = f.createLinearGradient(gx0, gy0, gx1, gy1);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      f.fillStyle = g; f.fill();
    }
    fillRegion(function () {
      f.moveTo(-5, -5); f.lineTo(W + 5, -5);
      for (x = W + 5; x >= -5; x -= 3) f.lineTo(x, yT(x));
      f.closePath();
    }, 0, 0, 'rgb(216,232,247)', 'rgb(104,132,172)', 0, 0, 0, topCap * 1.45);
    fillRegion(function () {
      f.moveTo(-5, -5); f.lineTo(-5, H + 5);
      for (y = H + 5; y >= -5; y -= 3) f.lineTo(xL(y), y);
      f.closePath();
    }, 0, 0, 'rgb(188,210,235)', 'rgb(100,130,172)', 0, 0, sideCap * 1.45, 0);
    fillRegion(function () {
      f.moveTo(W + 5, -5); f.lineTo(W + 5, H + 5);
      for (y = H + 5; y >= -5; y -= 3) f.lineTo(xR(y), y);
      f.closePath();
    }, 0, 0, 'rgb(188,210,235)', 'rgb(100,130,172)', W, 0, W - sideCap * 1.45, 0);
    fillRegion(function () {
      f.moveTo(-5, H + 5); f.lineTo(W + 5, H + 5);
      for (x = W + 5; x >= -5; x -= 3) f.lineTo(x, yB(x));
      f.closePath();
    }, 0, 0, 'rgb(228,240,252)', 'rgb(122,148,186)', 0, H - botCap * 1.4, 0, H);

    // snow grain
    var grain = Math.round(U * 1.4);
    for (i = 0; i < grain; i++) {
      x = rr(0, W); y = rnd() * yT(x);
      f.fillStyle = rnd() < 0.6 ? 'rgba(255,255,255,' + rr(0.06, 0.22).toFixed(2) + ')' : 'rgba(70,100,150,' + rr(0.05, 0.16).toFixed(2) + ')';
      f.beginPath(); f.arc(x, y, rr(0.5, 1.5), 0, TAU); f.fill();
      x = rr(0, W); y = H - rnd() * (H - yB(x));
      f.fillStyle = rnd() < 0.6 ? 'rgba(255,255,255,' + rr(0.06, 0.22).toFixed(2) + ')' : 'rgba(70,100,150,' + rr(0.05, 0.16).toFixed(2) + ')';
      f.beginPath(); f.arc(x, y, rr(0.5, 1.5), 0, TAU); f.fill();
    }

    // soft lit rim on the snow contours
    f.lineWidth = 1.3; f.strokeStyle = 'rgba(255,255,255,0.32)';
    f.beginPath(); for (x = -5; x <= W + 5; x += 3) { if (x === -5) f.moveTo(x, yB(x)); else f.lineTo(x, yB(x)); } f.stroke();
    f.strokeStyle = 'rgba(190,215,245,0.22)';
    f.beginPath(); for (x = -5; x <= W + 5; x += 3) { if (x === -5) f.moveTo(x, yT(x)); else f.lineTo(x, yT(x)); } f.stroke();

    // frost growing inward from the contours
    f.lineCap = 'round';
    var nF = Math.round(U / 7);
    for (i = 0; i < nF; i++) {
      f.beginPath();
      f.strokeStyle = 'rgba(215,236,255,' + rr(0.18, 0.46).toFixed(2) + ')'; f.lineWidth = rr(0.5, 1.1);
      var side = Math.floor(rnd() * 4);
      if (side === 0) { x = rr(0, W); frost(f, x, yT(x), Math.PI / 2 + rr(-0.5, 0.5), rr(8, 0.05 * U + 10), 0); }
      else if (side === 1) { y = rr(0, H); frost(f, xL(y), y, rr(-0.5, 0.5), rr(8, 0.05 * U + 10), 0); }
      else if (side === 2) { y = rr(0, H); frost(f, xR(y), y, Math.PI + rr(-0.5, 0.5), rr(8, 0.05 * U + 10), 0); }
      else { x = rr(0, W); frost(f, x, yB(x), -Math.PI / 2 + rr(-0.5, 0.5), rr(8, 0.05 * U + 10), 0); }
      f.stroke();
    }

    // icicles under the top snow edge: uneven gaps, many short, a few long, some clusters
    x = rr(0, 20);
    var sc = U / 800 + 0.35;
    while (x < W) {
      var len = U * (0.035 + 0.33 * Math.pow(rnd(), 2.4));
      var w = (3.2 + len * 0.075) * rr(0.7, 1.35);
      var tilt = rr(-0.07, 0.07), ph = rr(0, TAU);
      drawIcicle(f, x, yT(x) - 3, len, w, tilt, ph);
      tips.push({ x: x + tilt * len, y: yT(x) - 3 + len, len: len, w: w, ph: ph, cx: x });
      var cluster = rnd() < 0.28;
      x += cluster ? rr(w * 1.1, w * 2.6) : rr(10, 95) * sc;
      if (rnd() < 0.12) x += rr(60, 160) * sc;     // occasional bare stretch
    }
    // shorter icicles hanging from clumps on the side snow
    for (var sd = 0; sd < 2; sd++) {
      y = rr(U * 0.12, U * 0.2);
      while (y < H - botCap * 1.5) {
        var sx = sd === 0 ? xL(y) - 2 : xR(y) + 2;
        var sl = U * (0.02 + 0.13 * Math.pow(rnd(), 2.2));
        var sw = (2.4 + sl * 0.07) * rr(0.7, 1.3), st = rr(-0.05, 0.05), sp = rr(0, TAU);
        drawIcicle(f, sx, y, sl, sw, st, sp);
        tips.push({ x: sx + st * sl, y: y + sl, len: sl, w: sw, ph: sp, cx: sx });
        y += rr(70, 260) * sc;
      }
    }

    // glints on the ice and a few drips from the longest icicles
    var long = tips.filter(function (t) { return t.len > U * 0.07; });
    for (i = 0; i < Math.min(70, long.length * 2); i++) {
      var t = long[Math.floor(rnd() * long.length)], s = rr(0.08, 0.9);
      glints.push({ x: t.cx + (t.x - t.cx) * s * s, y: t.y - t.len * (1 - s), r: rr(1.1, 2.6), rate: rr(0.07, 0.22), ph: rr(0, TAU) });
    }
    for (i = 0; i < 24; i++) {
      x = rr(0, W);
      glints.push({ x: x, y: i % 2 ? yB(x) : yT(x), r: rr(1, 2.2), rate: rr(0.06, 0.18), ph: rr(0, TAU) });
    }
    long.sort(function (a, b) { return b.len - a.len; });
    for (i = 0; i < Math.min(9, long.length); i++) drips.push({ x: long[i].x, y: long[i].y, period: rr(5, 10), off: rr(0, 10), fall: U * rr(0.22, 0.4) });

    // mist field is rendered small and scaled up
    var s2 = Math.max(5, Math.sqrt(W * H / 30000));
    MW = Math.ceil(W / s2); MH = Math.ceil(H / s2);
    mist.width = MW; mist.height = MH; mimg = mctx.createImageData(MW, MH);

    // snowflakes in three depth layers
    flakes = [];
    function addLayer(n, smin, smax, amin, amax, cyc, layer) {
      for (var k = 0; k < n; k++) {
        flakes.push({
          x: rnd(), phase: rnd(), cycles: cyc[Math.floor(rnd() * cyc.length)], size: rr(smin, smax),
          swayAmp: rr(6, 26), swayK: 1 + Math.floor(rnd() * 3), swayPh: rr(0, TAU),
          driftAmp: rr(15, 60), driftPh: rr(0, TAU), wobK: 2 + Math.floor(rnd() * 5), wobPh: rr(0, TAU),
          spin: (rnd() < 0.5 ? -1 : 1) * (1 + Math.floor(rnd() * 2)), spinPh: rr(0, TAU),
          alpha: rr(amin, amax), layer: layer
        });
      }
    }
    addLayer(110, 0.5, 1.1, 0.25, 0.5, [1], 0);
    addLayer(70, 1.1, 2.0, 0.45, 0.75, [1, 2], 1);
    addLayer(28, 2.2, 4.2, 0.6, 0.95, [2], 2);
  }

  function drawFlakes(t, layerMin, layerMax) {
    for (var i = 0; i < flakes.length; i++) {
      var s = flakes[i];
      if (s.layer < layerMin || s.layer > layerMax) continue;
      var m = s.size * 4 + 6;
      var p = (s.phase + (t / DUR) * s.cycles + 0.015 * Math.sin(TAU * s.wobK * t / DUR + s.wobPh));
      p = p - Math.floor(p);
      var y = p * (H + 2 * m) - m;
      var x = s.x * W + Math.sin(TAU * s.swayK * t / DUR + s.swayPh) * s.swayAmp + Math.sin(TAU * t / DUR + s.driftPh) * s.driftAmp;
      var edge = Math.min(1, p / 0.05) * Math.min(1, (1 - p) / 0.05);
      var a = s.alpha * edge;
      if (s.size < 2.4) {
        ctx.fillStyle = 'rgba(235,245,255,' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, y, s.size, 0, TAU); ctx.fill();
      } else {
        var rot = TAU * s.spin * t / DUR + s.spinPh;
        ctx.strokeStyle = 'rgba(240,248,255,' + a.toFixed(3) + ')';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        for (var k = 0; k < 3; k++) {
          var an = rot + k * Math.PI / 3, dx = Math.cos(an) * s.size * 1.7, dy = Math.sin(an) * s.size * 1.7;
          ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy);
        }
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, y, s.size * 0.45, 0, TAU); ctx.fill();
      }
    }
  }

  function drawMist(t, g) {
    var d = mimg.data, asp = W / H, tt = t * 0.5;
    var pulse = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin(TAU * t / 5 - 1.2), 1.5);   // slow breathing rhythm
    for (var py = 0; py < MH; py++) {
      var Y = 1 - py / MH;
      for (var px = 0; px < MW; px++) {
        var X = px / MW * asp;
        var qx = X * 2.4 + 3.0, qy = Y * 1.8 - tt * 0.7;
        var wx = fbm(qx + tt * 0.2, qy), wy = fbm(qx + 7.3, qy + 2.1);
        var n = fbm(qx + wx * 1.8, qy + wy * 1.8);
        var dens = smooth(0.36, 0.78, n);
        var cxp = asp * 0.5 + 0.05 * Math.sin(Y * 4 + tt * 1.3) + (wx - 0.5) * 0.12 * Y;
        var spread = 0.05 + 0.22 * Y;
        var dxp = (X - cxp) / spread;
        var plume = Math.exp(-dxp * dxp) * (1 - smooth(0.3, 0.75, Y)) * pulse;
        var ground = (1 - smooth(0, 0.26, Y)) * 0.5;
        var a = dens * Math.max(plume, ground) * 0.55 * g;
        var o = (py * MW + px) * 4;
        d[o] = 205; d[o + 1] = 224; d[o + 2] = 245; d[o + 3] = a * 255;
      }
    }
    mctx.putImageData(mimg, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(mist, 0, 0, W, H);
  }

  function drawGlints(t) {
    for (var i = 0; i < glints.length; i++) {
      var s = glints[i];
      var v = Math.pow(Math.max(0, Math.sin(TAU * s.rate * t + s.ph)), 6);
      if (v < 0.02) continue;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * v).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.6 + 0.4 * v), 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(190,225,255,' + (0.18 * v).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.6, 0, TAU); ctx.fill();
    }
    for (var j = 0; j < drips.length; j++) {
      var dr = drips[j];
      var q = ((t + dr.off) % dr.period) / dr.period;
      if (q > 0.13) continue;
      var k = q / 0.13, yy = dr.y + k * k * dr.fall, al = (1 - k * 0.8);
      ctx.strokeStyle = 'rgba(210,235,255,' + (0.35 * al).toFixed(3) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(dr.x, yy - 6 * k - 2); ctx.lineTo(dr.x, yy); ctx.stroke();
      ctx.fillStyle = 'rgba(245,252,255,' + al.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(dr.x, yy, 1.4, 0, TAU); ctx.fill();
    }
  }

  function draw(t) {
    var g = Math.max(0, Math.min(1, t / 1.0, (DUR - t) / 1.0));
    ctx.globalAlpha = 1;
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#02050b'); bg.addColorStop(1, '#07111f');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    drawFlakes(t, 0, 1);
    drawMist(t, g);
    ctx.drawImage(frameCv, 0, 0, W, H);
    drawGlints(t);
    drawFlakes(t, 2, 2);

    var vg = ctx.createRadialGradient(W / 2, H / 2, U * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(0,0,0,' + (1 - g).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  var playing = true, tNow = 0, last = performance.now();
  var pp = document.getElementById('pp'), rs = document.getElementById('rs');
  var fill = document.getElementById('fill'), tm = document.getElementById('tm');

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    draw(tNow);
    fill.style.width = (tNow / DUR * 100) + '%';
    tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
