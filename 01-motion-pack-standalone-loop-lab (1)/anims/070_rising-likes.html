<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rising Likes Preview 15s</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #cfd8e3; --line: rgba(255,255,255,.18); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; opacity: .55; transition: opacity .2s; }
  .bar:hover { opacity: 1; }
  button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>
<script>
(function () {
  var DUR = 15;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // thumbs-up shape on a 24 x 24 grid
  var THUMB = new Path2D('M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z');

  var seed = 20261116;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  var palette = [
    [24, 119, 242],   // like blue
    [66, 153, 255],   // light blue
    [10, 95, 215],    // deep blue
    [120, 185, 255],  // pale blue
    [255, 255, 255]   // white
  ];

  var likes = [];
  var N = 60;
  for (var i = 0; i < N; i++) {
    var layer = rnd();                                         // 0 far, 1 near
    likes.push({
      x: rnd(),
      phase: rnd(),
      cycles: layer > 0.65 ? 1 : (layer > 0.3 ? 2 : 3),        // integer cycles per 15s keeps the loop seamless
      size: 3.5 + layer * layer * 13,
      swayAmp: 8 + rnd() * 24,
      swayK: 1 + Math.floor(rnd() * 3),
      swayPh: rnd() * Math.PI * 2,
      rotAmp: 0.1 + rnd() * 0.18,
      twK: 5 + Math.floor(rnd() * 12),
      twPh: rnd() * Math.PI * 2,
      alpha: 0.4 + layer * 0.5,
      col: palette[Math.floor(rnd() * palette.length)]
    });
  }

  function draw(t) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    var g = Math.max(0, Math.min(1, t / 1.0, (DUR - t) / 1.0));

    for (var i = 0; i < likes.length; i++) {
      var l = likes[i];
      var p = ((t / DUR) * l.cycles + l.phase) % 1;
      var m = l.size * 2.4;
      // rises from below the frame and keeps going past the top edge
      var y = H + m - p * (H + 2 * m);
      var x = l.x * W + Math.sin(2 * Math.PI * l.swayK * t / DUR + l.swayPh) * l.swayAmp;
      var rot = Math.sin(2 * Math.PI * l.swayK * t / DUR + l.swayPh + 1.3) * l.rotAmp;

      var env = Math.min(1, p / 0.08);
      var tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * l.twK * t / DUR + l.twPh);
      var a = l.alpha * env * (0.7 + 0.3 * tw) * g;
      if (a <= 0.004) continue;

      var c = l.col;
      var sc = l.size * 1.1 / 12;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      // tight outer glow
      ctx.save();
      ctx.scale(sc * 1.3, sc * 1.3);
      ctx.translate(-12, -12);
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.12).toFixed(3) + ')';
      ctx.fill(THUMB);
      ctx.restore();

      // icon body
      ctx.save();
      ctx.scale(sc, sc);
      ctx.translate(-12, -12);
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
      ctx.fill(THUMB);

      // soft highlight at twinkle peak
      if (tw > 0.75) {
        var k = (tw - 0.75) / 0.25;
        ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.3 * k).toFixed(3) + ')';
        ctx.fill(THUMB);
      }
      ctx.restore();
      ctx.restore();
    }
  }

  var playing = true, tNow = 0, last = performance.now();
  var pp = document.getElementById('pp'), rs = document.getElementById('rs');
  var fill = document.getElementById('fill'), tm = document.getElementById('tm');

  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    draw(tNow);
    fill.style.width = (tNow / DUR * 100) + '%';
    tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
