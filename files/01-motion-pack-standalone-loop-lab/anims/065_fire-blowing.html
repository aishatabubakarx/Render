<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Blowing Preview 15s</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #cfd8e3; --line: rgba(255,255,255,.18); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
  #sp { mix-blend-mode: screen; pointer-events: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; opacity: .55; transition: opacity .2s; z-index: 5; }
  .bar:hover { opacity: 1; }
  button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: var(--fg); font-size: 14px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="sp"></canvas>
<div id="msg">WebGL is not available in this browser.</div>
<div class="bar">
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uWind;
uniform float uFade;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.02 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}

void main() {
  float asp = uRes.x / uRes.y;
  vec2 uv = gl_FragCoord.xy / uRes.y;
  float y = uv.y;

  // wind leans the whole flame to the right, more with height
  float bend = uWind * pow(y, 1.5) * 1.15;
  float x = uv.x - bend;

  // large scale turbulence that sways the flame body
  float tb = fbm(vec2(uv.x * 2.0 - uT * 0.35, y * 2.0 - uT * 1.1));
  x += (tb - 0.5) * 0.38 * y;

  // fire source: low on the left side
  float cx = asp * 0.27;
  float wd = asp * 0.2;
  float base = exp(-pow((x - cx) / wd, 2.0));

  // rising, wind-stretched flame detail
  vec2 np = vec2(x * 5.0 - uWind * uT * 0.6, y * 3.2 - uT * 2.4);
  float n = fbm(np);
  float n2 = fbm(np * 2.0 + vec2(3.1, -uT * 1.5));

  float h = 0.12 + 0.55 * base;
  float fall = clamp(1.0 - y / h, 0.0, 1.0);
  float f = fall * (0.55 + 0.9 * n) * (0.75 + 0.5 * n2);
  f *= (0.35 + base * 0.9);

  float heat = smoothstep(0.12, 0.95, f * 1.5);

  vec3 col = vec3(0.0);
  col = mix(col, vec3(0.5, 0.04, 0.0), smoothstep(0.0, 0.25, heat));
  col = mix(col, vec3(1.0, 0.28, 0.02), smoothstep(0.2, 0.5, heat));
  col = mix(col, vec3(1.0, 0.65, 0.1), smoothstep(0.45, 0.75, heat));
  col = mix(col, vec3(1.0, 0.95, 0.7), smoothstep(0.75, 1.0, heat));

  gl_FragColor = vec4(col * uFade, 1.0);
}
</script>

<script>
(function () {
  var DUR = 15, TAU = Math.PI * 2;
  var glc = document.getElementById('gl');
  var spc = document.getElementById('sp');
  var sctx = spc.getContext('2d');
  var gl = glc.getContext('webgl');
  if (!gl) { document.getElementById('msg').style.display = 'flex'; return; }

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uT = gl.getUniformLocation(prog, 'uT');
  var uWind = gl.getUniformLocation(prog, 'uWind');
  var uFade = gl.getUniformLocation(prog, 'uFade');

  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    glc.width = Math.round(W * dpr); glc.height = Math.round(H * dpr);
    spc.width = Math.round(W * dpr); spc.height = Math.round(H * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gl.viewport(0, 0, glc.width, glc.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function wind(u) {
    return 0.62 + 0.22 * Math.sin(2 * u + 0.6) + 0.1 * Math.sin(5 * u + 2.1) + 0.05 * Math.sin(9 * u);
  }

  var seed = 20261118;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  var sparks = [];
  for (var j = 0; j < 45; j++) {
    sparks.push({
      x: 0.08 + rnd() * 0.35, y: 0.8 + rnd() * 0.15, phase: rnd(),
      cycles: 2 + Math.floor(rnd() * 3), reach: 0.35 + rnd() * 0.5, rise: 0.05 + rnd() * 0.22,
      size: 0.7 + rnd() * 1.2, kF: 8 + Math.floor(rnd() * 14), ph: rnd() * TAU, alpha: 0.5 + rnd() * 0.45
    });
  }

  function drawSparks(t, g, wnd) {
    var u = TAU * t / DUR;
    sctx.clearRect(0, 0, W, H);
    sctx.lineCap = 'round';
    for (var j = 0; j < sparks.length; j++) {
      var S = sparks[j];
      var p = ((t / DUR) * S.cycles + S.phase) % 1;
      var env = Math.min(1, p / 0.08) * Math.pow(1 - p, 1.3);
      var fl = 0.6 + 0.4 * Math.sin(u * S.kF + S.ph);
      var a = S.alpha * env * fl * g;
      if (a <= 0.004) continue;
      var drift = (0.55 + 0.45 * wnd) * S.reach * W;
      var x = S.x * W + p * drift;
      var y = S.y * H - p * S.rise * H + Math.sin(u * 3 + S.ph + p * 6) * 8 * p;
      var pp2 = Math.max(0, p - 0.015);
      var xp = S.x * W + pp2 * drift;
      var yp = S.y * H - pp2 * S.rise * H;
      var cg = Math.round(215 - p * 120), cb = Math.round(120 - p * 100);
      sctx.beginPath();
      sctx.strokeStyle = 'rgba(255,' + cg + ',' + cb + ',' + (a * 0.6).toFixed(3) + ')';
      sctx.lineWidth = S.size;
      sctx.moveTo(xp, yp); sctx.lineTo(x, y); sctx.stroke();
      sctx.beginPath();
      sctx.fillStyle = 'rgba(255,' + cg + ',' + cb + ',' + a.toFixed(3) + ')';
      sctx.arc(x, y, S.size * 0.8, 0, TAU); sctx.fill();
    }
  }

  var playing = true, tNow = 0, last = performance.now();
  var pp = document.getElementById('pp'), rs = document.getElementById('rs');
  var fill = document.getElementById('fill'), tm = document.getElementById('tm');

  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    var g = Math.max(0, Math.min(1, tNow / 1.0, (DUR - tNow) / 1.0));
    var wnd = wind(TAU * tNow / DUR);
    gl.uniform2f(uRes, glc.width, glc.height);
    gl.uniform1f(uT, tNow);
    gl.uniform1f(uWind, wnd);
    gl.uniform1f(uFade, g);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    drawSparks(tNow, g, wnd);
    fill.style.width = (tNow / DUR * 100) + '%';
    tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
