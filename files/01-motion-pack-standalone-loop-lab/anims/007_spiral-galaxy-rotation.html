<!doctype html><html><head><meta charset="utf-8"><style>:root{color-scheme:dark}html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,T=15,TAU=Math.PI*2;
let sd=11;const R=()=>(sd=sd*16807%2147483647)/2147483647;
const G=[];
for(let i=0;i<6200;i++){const r=0.07+0.93*Math.pow(R(),0.6),arm=i%2;
 G.push({r,t0:arm*Math.PI+2.5*Math.log(r/0.07)+(R()-.5)*(0.35+0.55*r),k:Math.max(1,Math.round(1+3.4*Math.pow(1-r,2))),z:(R()-.5)*0.06*(1.3-r),m:R(),p:R()*TAU,h:R()<.1})}
for(let i=0;i<1500;i++){const r=0.3*Math.pow(R(),1.6),a=R()*TAU;G.push({r,t0:a,k:2+Math.round(3*(1-r/.3)),z:(R()-.5)*0.34*(1-r/.35),m:R(),p:R()*TAU,h:false,b:1})}
const B=[];for(let i=0;i<280;i++)B.push({x:R()*W,y:R()*H,d:R()*0.9+0.1,p:R()*TAU,n:1+Math.floor(R()*3)});
const PL=[{r:.36,k:5,c:'255,190,120',s:5,t:.4},{r:.55,k:3,c:'150,200,255',s:7,t:2.1},{r:.74,k:2,c:'255,150,170',s:6,t:4.0},{r:.93,k:1,c:'190,255,200',s:8,t:5.3}];
function cam(t){const u=TAU*t/T;return{tilt:1.0+0.2*Math.sin(u),roll:0.42*Math.sin(u+0.8),zoom:1+0.16*Math.sin(u-1.1),px:26*Math.sin(u),py:12*Math.cos(u)}}
function P(r,th,z,C){const X=r*Math.cos(th),Y=r*Math.sin(th),ct=Math.cos(C.tilt),st=Math.sin(C.tilt);
 const y1=Y*ct-z*st,z1=Y*st+z*ct,cr=Math.cos(C.roll),sr=Math.sin(C.roll),xr=X*cr-y1*sr,yr=X*sr+y1*cr,q=3/(3-z1*0.9),S=410*C.zoom*q;
 return[W/2+C.px+xr*S,H/2+C.py+yr*S,q,z1]}
function draw(t){const C=cam(t),u=TAU*t/T;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
 for(const b of B){const a=.25+.3*Math.sin(u*b.n+b.p);x.fillStyle='rgba(200,215,255,'+a*b.d+')';const sx=((b.x-C.px*b.d*1.6)%W+W)%W,sy=((b.y-C.py*b.d*1.6)%H+H)%H;x.fillRect(sx,sy,1+b.d*1.2,1+b.d*1.2)}
 const[cx,cy,cq]=P(0,0,0,C),gr=x.createRadialGradient(cx,cy,0,cx,cy,240*C.zoom);gr.addColorStop(0,'rgba(255,235,200,.95)');gr.addColorStop(.25,'rgba(255,190,120,.45)');gr.addColorStop(1,'rgba(255,150,90,0)');x.fillStyle=gr;x.fillRect(cx-250*C.zoom,cy-250*C.zoom,500*C.zoom,500*C.zoom);
 for(const s of G){const th=s.t0+u*s.k,p=P(s.r,th,s.z,C),tw=.55+.45*Math.sin(u*2+s.p),warm=s.b||s.r<.2;
  x.fillStyle=s.h?'rgba(255,140,190,'+.55*tw+')':warm?'rgba(255,215,160,'+(.35+.4*s.m)*tw+')':'rgba(175,205,255,'+(.3+.5*s.m)*tw+')';
  const z=(.9+1.5*s.m*(1-s.r*.6))*p[2];x.fillRect(p[0],p[1],z,z)}
 for(const o of PL){for(let j=40;j>=0;j--){const tt=t-j*0.03,p=P(o.r,o.t+TAU*o.k*tt/T,0,cam(tt));x.fillStyle='rgba('+o.c+','+.5*(1-j/40)+')';const z=o.s*p[2]*(1-j/50)*.6;x.beginPath();x.arc(p[0],p[1],Math.max(z,.6),0,TAU);x.fill()}
  const p=P(o.r,o.t+TAU*o.k*t/T,0,C),g=x.createRadialGradient(p[0],p[1],0,p[0],p[1],o.s*3.2*p[2]);g.addColorStop(0,'rgba('+o.c+',1)');g.addColorStop(.35,'rgba('+o.c+',.5)');g.addColorStop(1,'rgba('+o.c+',0)');x.fillStyle=g;x.beginPath();x.arc(p[0],p[1],o.s*3.2*p[2],0,TAU);x.fill()}}
const t0=performance.now();(function f(){draw(((performance.now()-t0)/1000)%T);requestAnimationFrame(f)})();
</script></body></html>
