name: Upload clips to Adobe Stock, Shutterstock and Pond5
on:
  workflow_run:
    workflows: ["Render stock clips"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of a finished render (the number after /runs/ in the run page URL)
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: stock-upload
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download clips and CSV files from the render run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output tmp/clips tmp/other
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | [.name, .size_in_bytes] | @tsv' > tmp/list.tsv || true
          if [ ! -s tmp/list.tsv ]; then echo "no artifacts in this run"; exit 0; fi
          while IFS=$'\t' read -r name size; do
            if echo "$name" | grep -qi 'pack'; then
              # pack artifacts are only searched for CSV files; skip the huge ones to save disk space
              if [ "$size" -gt 524288000 ]; then echo "skipping large pack artifact $name"; continue; fi
              dest="tmp/other/$name"
            else
              dest="tmp/clips/$name"
            fi
            gh run download "$RUN_ID" -R "${{ github.repository }}" -n "$name" -D "$dest" || echo "could not download $name"
          done < tmp/list.tsv
          # only clip artifacts feed the stock sites
          find tmp/clips -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' -o -iname '*.mpg' -o -iname '*.mpeg' -o -iname '*.avi' \) ! -iname '*.part.*' -exec mv -n {} output/ \;

      - name: Find CSV files and save them to the repo root
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python stock_push.py --collect-csv tmp output --csv-dest . --label "$RUN_ID"

      - name: Make the CSV files downloadable from the run page
        uses: actions/upload-artifact@v4
        with:
          name: stock-csv-${{ env.RUN_ID }}
          path: '*_run${{ env.RUN_ID }}*.csv'
          if-no-files-found: ignore

      - name: Upload new clips (Adobe Stock, Shutterstock, Pond5)
        env:
          ADOBE_SFTP_HOST: ${{ secrets.ADOBE_SFTP_HOST }}
          ADOBE_SFTP_USER: ${{ secrets.ADOBE_SFTP_USER }}
          ADOBE_SFTP_PASS: ${{ secrets.ADOBE_SFTP_PASS }}
          SHUTTERSTOCK_USER: ${{ secrets.SHUTTERSTOCK_USER }}
          SHUTTERSTOCK_PASS: ${{ secrets.SHUTTERSTOCK_PASS }}
          POND5_USER: ${{ secrets.POND5_USER }}
          POND5_PASS: ${{ secrets.POND5_PASS }}
          POND5_HOST: ${{ secrets.POND5_HOST }}
        run: |
          pip install paramiko
          python stock_push.py output

      - name: Commit CSV files and upload records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          changed=0
          # 1) CSV files get their own commit, named after the files, so they are easy to find
          git add -f -- ./*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            names=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -q -m "CSV: $names"
            changed=1
          fi
          # 2) upload records are a separate commit
          for d in .adobe_uploaded .shutterstock_uploaded .pond5_uploaded; do
            git add "$d" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Adobe/Shutterstock/Pond5 upload records"
            changed=1
          fi
          [ "$changed" -eq 0 ] && exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          echo "push failed after 4 tries"; exit 1
