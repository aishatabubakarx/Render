name: unzip
on:
  push:
    paths:
      - 'stock-render-kit.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip it
        run: |
          unzip -o stock-render-kit.zip
          rm stock-render-kit.zip
          
      - name: Push it back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzipped stock-render-kit.zip [skip ci]" || exit 0
          git push
