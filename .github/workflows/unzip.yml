name: unzip
on: [push, workflow_dispatch]

permissions:
  contents: write
  workflows: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o stock-render-kit.zip
          rm stock-render-kit.zip

      - name: Push back
        run: |
          git config user.name "【entity-github¦canonical_name=GitHub】-actions[bot]"
          git config user.email "bot@【entity-github¦canonical_name=GitHub】.com"
          git add -A
          git commit -m "Unzipped files [skip ci]" || exit 0
          git push
