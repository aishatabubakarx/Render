name: unzip
on: [push]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip stock-render-kit.zip
        run: |
          unzip -o stock-render-kit.zip
          rm stock-render-kit.zip

      - name: Push unzipped files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "unzipped stock-render-kit.zip" || echo "nothing to commit"
          git push
