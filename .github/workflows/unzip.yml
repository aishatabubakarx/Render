name: unzip
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip without workflows folder
        run: |
          unzip -o stock-render-kit.zip -x ".github/*"
          rm -f stock-render-kit.zip

      - name: Push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Unzipped stock-render-kit.zip [skip ci]" || exit 0
          git push
