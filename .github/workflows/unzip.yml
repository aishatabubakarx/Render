name: unzip
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          if [ -f stock-render-kit.zip ]; then
            unzip -o stock-render-kit.zip
            rm stock-render-kit.zip
          else
            echo "no zip found, skipping"
            exit 0
          fi

      - name: Push back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Unzipped files [skip ci]" || exit 0
          git push
