name: unzip
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip any zip files
        run: |
          shopt -s nullglob
          for zip in *.zip; do
            echo "Unzipping $zip"
            unzip -o "$zip" -x ".github/*"
            rm -f "$zip"
          done

      - name: Push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Unzipped zip files [skip ci]" || exit 0
          git push
