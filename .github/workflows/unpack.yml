name: Unpack file to root
on:
  workflow_dispatch:
    inputs:
      file:
        description: File name or path (for example stock-render-kit.zip)
        required: true
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}
      - name: Move contents to root and delete the file
        env:
          NAME: ${{ inputs.file }}
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob

          # 1. Find the file (exact path first, then by name anywhere in the repo)
          if [ -f "$NAME" ]; then
            SRC="$NAME"
          else
            SRC=$(find . -path ./.git -prune -o -type f -name "$(basename "$NAME")" -print | head -n 1)
          fi
          if [ -z "${SRC:-}" ] || [ ! -f "$SRC" ]; then
            echo "File not found: $NAME"; exit 1
          fi
          SRC="${SRC#./}"

          # 2. Unpack to a temp folder (archives are extracted, other files are copied)
          TMP=$(mktemp -d)
          case "${SRC,,}" in
            *.zip)            unzip -q "$SRC" -d "$TMP" ;;
            *.tar.gz|*.tgz)   tar -xzf "$SRC" -C "$TMP" ;;
            *.tar.bz2|*.tbz2) tar -xjf "$SRC" -C "$TMP" ;;
            *.tar)            tar -xf "$SRC" -C "$TMP" ;;
            *)
              if [ "$(dirname "$SRC")" = "." ]; then
                echo "$SRC is already in the root and is not an archive. Nothing to do."; exit 0
              fi
              cp "$SRC" "$TMP/" ;;
          esac
          rm -rf "$TMP/__MACOSX"

          # 3. If the archive has one top-level folder, use what is inside it
          ITEMS=("$TMP"/*)
          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            TMP="${ITEMS[0]}"
          fi

          # 4. Delete the original and copy the contents to the root
          rm -f "$SRC"
          cp -a "$TMP"/. .

          # 5. Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $SRC to root" || { echo "No changes to commit"; exit 0; }
          git push
