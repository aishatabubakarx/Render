name: Move stock-render-kit to root
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Overwrite files that already exist at the root (true/false)
        default: 'false'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Move files up to the repo root
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -e
          SRC=stock-render-kit
          [ -d "$SRC" ] || { echo "Folder $SRC not found"; exit 1; }

          # find files that already exist at the root
          conflicts=$(cd "$SRC" && find . -type f | while read -r f; do [ -e "../$f" ] && echo "$f"; done || true)
          if [ -n "$conflicts" ]; then
            echo "These files already exist at the root:"
            echo "$conflicts"
            if [ "$OVERWRITE" != "true" ]; then
              echo "Stopping. Nothing was changed. Re-run with overwrite=true to replace them."
              exit 1
            fi
          fi

          cp -a "$SRC"/. .
          git rm -r -q "$SRC"
          rm -rf "$SRC"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move stock-render-kit files to repo root [skip ci]"
          git pull --rebase -q
          git push
