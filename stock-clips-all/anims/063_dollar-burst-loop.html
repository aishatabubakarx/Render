let bills=[];
function sprite(img,seed){
  const cv=mk(SW,SH),c=cv.getContext('2d'),r=rng(seed);
  c.save();rr(c,0,0,SW,SH,10);c.clip();
  c.drawImage(img,0,0,SW,SH);
  // wear: light/dark blotches
  for(let i=0;i<9;i++){const x=r()*SW,y=r()*SH,rad=40+r()*110,g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,r()<.5?'rgba(255,255,240,.18)':'rgba(70,70,40,.14)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);}
  // cotton/linen fibres
  for(let i=0;i<260;i++){const x=r()*SW,y=r()*SH,a=r()*6.28,l=5+r()*12;c.strokeStyle=r()<.5?'rgba(170,50,50,.35)':'rgba(50,80,150,.35)';c.lineWidth=.7;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}
  // folds and creases: dark line with light twin
  const creases=2+Math.floor(r()*3);
  for(let i=0;i<creases;i++){
    const vert=r()<.6,pos=(.15+r()*.7),wob=r()*6;
    c.beginPath();
    for(let t=0;t<=1.001;t+=.02){const x=vert?SW*pos+Math.sin(t*9+wob)*5+(t-.5)*r()*0:SW*t,y=vert?SH*t:SH*pos+Math.sin(t*9+wob)*4;c[t===0?'moveTo':'lineTo'](x,y);}
    c.strokeStyle='rgba(30,30,20,.30)';c.lineWidth=1.6;c.stroke();
    c.save();c.translate(vert?2.2:0,vert?0:2.2);c.strokeStyle='rgba(255,255,245,.28)';c.lineWidth=1.4;c.stroke();c.restore();
  }
  c.restore();
  // pixel pass: grain + contrast + ragged worn edges
  const id=c.getImageData(0,0,SW,SH),d=id.data;
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    const i=(y*SW+x)*4;if(d[i+3]===0)continue;
    const n=(Math.random()-.5)*30;
    d[i]=Math.max(0,Math.min(255,(d[i]-128)*1.16+128+n));
    d[i+1]=Math.max(0,Math.min(255,(d[i+1]-128)*1.16+128+n));
    d[i+2]=Math.max(0,Math.min(255,(d[i+2]-128)*1.16+128+n*.9));
    const e=Math.min(x,y,SW-1-x,SH-1-y);
    if(e<4){const k=(4-e)/4;if(Math.random()<k*.45){d[i+3]=0;}else{const m=1-k*.35;d[i]*=m;d[i+1]*=m;d[i+2]*=m;}}
  }
  c.putImageData(id,0,0);
  return cv;
}
function boot(fi,bi){
  const sil=mk(SW,SH),s=sil.getContext('2d');s.fillStyle='#000';rr(s,0,0,SW,SH,10);s.fill();
  for(let v=0;v<4;v++)bills.push({f:sprite(fi,3+v*9),b:sprite(bi,5+v*13),dark:sil});
  requestAnimationFrame(frame);
}
const rand=rng(2026),T=6,leaves=[];
const BURSTS=[{ph:0,n:40},{ph:.31,n:30},{ph:.63,n:36}];
BURSTS.forEach(B=>{
  B.ox=(rand()-.5)*.14;B.oy=(rand()-.5)*.14;
  B.cl=[rand()*6.28,rand()*6.28,rand()*6.28];
  for(let i=0;i<B.n;i++){
    const z=Math.pow(rand(),1.4),g=(rand()+rand()+rand()-1.5)*.9;
    leaves.push({
      ox:B.ox,oy:B.oy,z,
      ang:rand()<.65?B.cl[Math.floor(rand()*3)]+g:rand()*6.28,
      ph:B.ph+rand()*.14,kk:rand()<.28?2:1,
      spd:.75+rand()*.6+z*.3,size:.3+z*.8,
      spin:(rand()<.5?-1:1)*(.15+rand()*2),rot0:rand()*6.28,
      flip:1+Math.floor(rand()*5),flip0:rand()*6.28,
      swirl:(rand()-.5)*1.2,bend:5+rand()*13,bph:rand()*6.28,sag:rand(),wob:1+Math.floor(rand()*3),wamp:rand(),wph:rand()*6.28,
      sp:Math.floor(rand()*4)
    });
  }
});
const ease=x=>1-Math.pow(1-x,3);

function frame(ms){
  const t=ms/1000;
  ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const unit=Math.min(W,H)/800;
  for(const l of leaves){
    const p=(((t/T)*l.kk)+l.ph)%1,e=ease(p),a=l.ang+l.swirl*e;
    const x0=W/2+l.ox*W,y0=H/2+l.oy*H,c=Math.cos(a),sn=Math.sin(a);
    const ex=c>0?(W-x0)/(c+1e-4):x0/(-c+1e-4),ey=sn>0?(H-y0)/(sn+1e-4):y0/(-sn+1e-4);
    const exitD=Math.min(ex,ey)+170;
    const f=1.2*(.6*p+.4*(1-(1-p)*(1-p)));
    const d=exitD*f*l.spd;
    const wob=Math.sin(p*6.2832*l.wob+l.wph)*l.wamp*40*unit*Math.min(1,p*3);
    const x=x0+c*d-sn*wob,y=y0+sn*d+c*wob+l.sag*p*p*H*.12;
    const alpha=Math.min(1,p/.05)*Math.min(1,(1-p)/.3)*(.88+.12*l.z);
    if(alpha<=.01)continue;
    const s=l.size*unit*(.45+e*.55)*.85;
    const fx=Math.cos(l.flip0+l.flip*6.2832*p);
    const ax=Math.max(.12,Math.abs(fx));
    const sp=bills[l.sp],img=fx>=0?sp.f:sp.b;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(l.rot0+l.spin*e*3+Math.sin(p*6.2832+l.wph)*.3);
    ctx.scale(s,s*ax);
    ctx.globalAlpha=alpha;
    const N=14,dw=BW/N,sw=SW/N,bt=Math.sin(p*6.2832*l.wob+l.bph)*l.bend;
    let prev=0;
    for(let i=0;i<N;i++){
      const u=(i+.5)/N,dy=bt*Math.sin(Math.PI*u)+bt*.3*Math.sin(u*9.4+l.bph);
      const nu=(i+1.5)/N,ndy=bt*Math.sin(Math.PI*Math.min(nu,1))+bt*.3*Math.sin(nu*9.4+l.bph);
      ctx.drawImage(img,i*sw,0,sw+1,SH,-BW/2+i*dw,-BH/2+dy,dw+.7,BH);
      const sl=Math.abs(ndy-dy);
      if(sl>.4){const g0=ctx.globalAlpha;ctx.globalAlpha=g0*Math.min(.4,sl*.07);ctx.drawImage(sp.dark,i*sw,0,sw+1,SH,-BW/2+i*dw,-BH/2+dy,dw+.7,BH);ctx.globalAlpha=g0;}
    }
    ctx.globalAlpha=alpha*(1-Math.abs(fx))*.55;
    ctx.drawImage(sp.dark,-BW/2,-BH/2,BW,BH);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

let _f,_b,_n=0;const _go=()=>{if(++_n===2)boot(_f,_b);};
_f=new Image();_f.onload=_go;_f.src=FRONT_SRC;
_b=new Image();_b.onload=_go;_b.src=BACK_SRC;
</script>
