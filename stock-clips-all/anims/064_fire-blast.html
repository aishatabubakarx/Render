<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Blast Preview 15s</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #cfd8e3; --line: rgba(255,255,255,.18); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; opacity: .55; transition: opacity .2s; z-index: 5; }
  .bar:hover { opacity: 1; }
  button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fg); }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: var(--fg); font-size: 14px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="msg">WebGL is not available in this browser.</div>
<div class="bar">
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uFade;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(5.2, 1.3);
    a *= 0.5;
  }
  return v;
}

// thin bright lines where the noise field crosses a level, like the folded edges of a flame sheet
float ridge(float n) {
  float r = 1.0 - abs(2.0 * n - 1.0);
  return pow(r, 3.0);
}

void main() {
  float asp = uRes.x / uRes.y;
  vec2 uv = vec2(gl_FragCoord.x / uRes.x, gl_FragCoord.y / uRes.y);
  vec2 p = vec2(uv.x * asp, uv.y);

  float speed = 1.15;             // the blast travels left to right
  float tt = uT * speed;

  // flow-warped coordinates: everything is carried to the right and curled by turbulence
  vec2 q = vec2(p.x * 2.6 - tt * 1.6, p.y * 2.6);
  vec2 w1 = vec2(fbm(q + vec2(0.0, tt * 0.35)), fbm(q + vec2(4.7, 1.9 - tt * 0.3)));
  vec2 w2 = vec2(fbm(q * 1.9 + w1 * 2.2 + vec2(1.3, tt * 0.5)), fbm(q * 1.9 + w1 * 2.2 + vec2(8.1, 2.7)));
  vec2 s = q + (w1 - 0.5) * 1.6 + (w2 - 0.5) * 0.9;

  // body of the blast: a band across the middle of the frame, ragged at both edges
  float cy = 0.5 + 0.04 * sin(tt * 0.9 + p.x * 1.4) + (fbm(vec2(p.x * 1.2 - tt * 0.8, 3.3)) - 0.5) * 0.16;
  float halfH = 0.17 + 0.05 * sin(p.x * 1.6 - tt * 1.2) + 0.05 * fbm(vec2(p.x * 2.0 - tt, 7.7));
  float dy = (p.y - cy) / halfH;
  float band = 1.0 - smoothstep(0.55, 1.15, abs(dy) + (fbm(s * 1.3) - 0.5) * 0.55);

  // left side is the nozzle, the front on the right breaks up into detached clumps
  float xN = uv.x;
  float front = 0.66 + 0.1 * sin(tt * 0.8) + (fbm(vec2(tt * 0.5, p.y * 3.0)) - 0.5) * 0.18;
  float tail = 1.0 - smoothstep(front - 0.12, front + 0.2, xN + (fbm(s * 1.1) - 0.5) * 0.3);
  float body = band * tail;

  // fine filament structure inside the body
  float n1 = fbm(s * 1.25);
  float n2 = fbm(s * 2.6 + vec2(3.3, tt * 0.4));
  float lines = ridge(n1) * 0.75 + ridge(n2) * 0.55;
  float fill = 0.25 + 0.65 * fbm(s * 0.9 + vec2(9.0, 0.0));

  float dens = body * (0.35 * fill + 0.85 * lines);

  // clumps that detach from the front
  float clump = smoothstep(0.55, 0.9, fbm(vec2(p.x * 2.2 - tt * 1.4, p.y * 3.4) + w1)) *
                smoothstep(front - 0.08, front + 0.08, xN) * (1.0 - smoothstep(front + 0.12, front + 0.3, xN)) *
                (1.0 - smoothstep(0.35, 1.0, abs(dy)));
  dens += clump * 0.7 * ridge(fbm(s * 1.8));

  dens = clamp(dens, 0.0, 1.0);

  // colour from the reference: deep orange body, amber edges, a little yellow in the brightest filaments
  float heat = smoothstep(0.05, 0.95, dens);
  vec3 col = vec3(0.0);
  col = mix(col, vec3(0.42, 0.07, 0.0), smoothstep(0.0, 0.22, heat));
  col = mix(col, vec3(0.80, 0.30, 0.02), smoothstep(0.15, 0.5, heat));
  col = mix(col, vec3(0.96, 0.52, 0.07), smoothstep(0.4, 0.78, heat));
  col = mix(col, vec3(1.0, 0.72, 0.30), smoothstep(0.78, 1.0, heat));

  // dark pockets inside the fire keep the structure readable
  float pocket = smoothstep(0.1, 0.45, n2);
  col *= 0.55 + 0.45 * pocket;

  gl_FragColor = vec4(col * uFade, 1.0);
}
</script>

<script>
(function () {
  var DUR = 15;
  var glc = document.getElementById('gl');
  var gl = glc.getContext('webgl');
  if (!gl) { document.getElementById('msg').style.display = 'flex'; return; }

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uT = gl.getUniformLocation(prog, 'uT');
  var uFade = gl.getUniformLocation(prog, 'uFade');

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    glc.width = Math.round(window.innerWidth * dpr);
    glc.height = Math.round(window.innerHeight * dpr);
    gl.viewport(0, 0, glc.width, glc.height);
  }
  window.addEventListener('resize', resize);
  resize();

  var playing = true, tNow = 0, last = performance.now();
  var pp = document.getElementById('pp'), rs = document.getElementById('rs');
  var fill = document.getElementById('fill'), tm = document.getElementById('tm');

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    var g = Math.max(0, Math.min(1, tNow / 1.0, (DUR - tNow) / 1.0));
    gl.uniform2f(uRes, glc.width, glc.height);
    gl.uniform1f(uT, tNow + 20.0);
    gl.uniform1f(uFade, g);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    fill.style.width = (tNow / DUR * 100) + '%';
    tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
