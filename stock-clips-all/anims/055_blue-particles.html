<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Particles – 15 s Loop</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#cfeaff;--dim:#5f86ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid #0e2a45}
canvas{width:100%;height:100%;display:block}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#06192e;color:var(--ink);border:1px solid #1d5f9e;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#0b2a4b}
button:focus-visible,input:focus-visible{outline:2px solid #7fd0ff;outline-offset:2px}
input[type=range]{flex:1;accent-color:#3aa8ff}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="bar">
  <button id="pp" aria-label="Play or pause">Pause</button>
  <input id="sc" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline">
  <span id="tm">0.0 s</span>
</div>
<script>
(function(){
const T=15,TAU=Math.PI*2,cv=document.getElementById('cv'),g=cv.getContext('2d'),stage=document.getElementById('stage');
let W=1280,H=720,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',size);size();

/* glow sprites in three blues */
function sprite(r,gc,b){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 const gr=x.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,`rgba(${r+90},${gc+60},255,.95)`);
 gr.addColorStop(.35,`rgba(${r},${gc},${b},.4)`);gr.addColorStop(1,`rgba(${r},${gc},${b},0)`);
 x.fillStyle=gr;x.fillRect(0,0,64,64);return c;}
const SP=[sprite(30,110,255),sprite(20,170,255),sprite(60,60,255)];

/* seeded random so every viewer sees the same video */
let s=7;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* every motion is periodic in 15 s, so the loop is seamless */
const P=[];
for(let i=0;i<1100;i++){const d=Math.pow(rnd(),1.6);          // 0 far … 1 near
 P.push({x:rnd(),y:rnd(),d,k:d>.75?3:d>.4?2:1,sa:(.01+.05*d)*(rnd()+.4),sn:1+Math.floor(rnd()*3),sp:rnd()*TAU,
  tm:2+Math.floor(rnd()*6),tp:rnd()*TAU,c:Math.floor(rnd()*3),sz:2+d*d*20+rnd()*3});}
const B=[];                                                     // large soft bokeh
for(let i=0;i<14;i++)B.push({x:rnd(),y:rnd(),r:90+rnd()*160,k:1,sn:1,sp:rnd()*TAU,tm:1+Math.floor(rnd()*2),tp:rnd()*TAU,c:Math.floor(rnd()*3)});

function draw(t){
 const u=t/T;g.setTransform(dpr,0,0,dpr,0,0);g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,W,H);
 g.globalCompositeOperation='lighter';
 /* faint breathing haze behind everything */
 const hz=g.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,W*.55);const hb=.05+.025*Math.sin(u*TAU);
 hz.addColorStop(0,`rgba(20,80,200,${hb})`);hz.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=hz;g.fillRect(0,0,W,H);
 B.forEach(b=>{const x=((b.x+.06*Math.sin(u*TAU+b.sp))%1)*W,y=(((b.y-u*b.k)%1)+1)%1*H,a=.035+.03*Math.sin(u*TAU*b.tm+b.tp);
  g.globalAlpha=Math.max(0,a);g.drawImage(SP[b.c],x-b.r,y-b.r,b.r*2,b.r*2);});
 P.forEach(p=>{
  const y=(((p.y-u*p.k)%1)+1)%1,x=p.x+p.sa*Math.sin(u*TAU*p.sn+p.sp+y*5);
  const tw=.5+.5*Math.sin(u*TAU*p.tm+p.tp),edge=Math.min(1,y*8,(1-y)*8);
  g.globalAlpha=(.25+.75*tw)*(.35+.65*p.d)*edge;
  const sz=p.sz*(.8+.4*tw);g.drawImage(SP[p.c],((x%1+1)%1)*W-sz/2,y*H-sz/2,sz,sz);});
 g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

const pb=document.getElementById('pp'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
let t=0,playing=true,last=performance.now(),drag=false;
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';};
sc.addEventListener('input',()=>{drag=true;t=parseFloat(sc.value);});
sc.addEventListener('change',()=>{drag=false;});
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&!drag){t+=dt;if(t>=T)t-=T;}
 if(!drag)sc.value=t;tm.textContent=t.toFixed(1)+' s';draw(t);requestAnimationFrame(loop);})(last);
})();
</script>
</body>
</html>
