<title>Holographic House – 15 s Projection</title>
<style>

*{box-sizing:border-box}

canvas{width:100%;height:100%;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.hud{position:absolute;z-index:2;font-size:clamp(11px,1.6vw,18px);letter-spacing:.14em;color:#7fc4ff;text-shadow:0 0 8px #1a7dff}
#ttl{left:3%;top:4%}
#ph{left:3%;bottom:5%;font-size:clamp(13px,2.2vw,26px);color:#d6efff}
#tc{right:3%;top:4%;font-variant-numeric:tabular-nums}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#06192e;color:var(--ink);border:1px solid #1d5f9e;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#0b2a4b}
button:focus-visible,input:focus-visible{outline:2px solid #7fd0ff;outline-offset:2px}
input[type=range]{flex:1;accent-color:#3aa8ff}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
#err{display:none;color:#ff9a9a;padding:20px}
</style>
</head>
<body>

 [6.4,0,4.2],[6.4,8,4.2],[6.1,0,4.2],[6.7,0,4.2],[6.1,8,4.2],[6.7,8,4.2],[4.6,8,4.2],[6.1,8,4.2]];seg(s,M.dim,D);}
const labs=[];
function label(txt,x,y,z){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='600 34px Arial Narrow,Arial,sans-serif';g.fillStyle='#bfe8ff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,128,32);
 const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,blending:ADD,depthWrite:false,opacity:0});const sp=new THREE.Sprite(m);sp.scale.set(5,1.25,1);sp.position.set(x,y,z);D.add(sp);labs.push(m);}
label('12.6 m',-1.7,.8,5);label('6.0 m',5.6,.8,0);label('8.0 m',6.4,4,4.2);
/* particles */
const PN=320,pp=new Float32Array(PN*3);for(let i=0;i<PN;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*15;pp[i*3]=Math.cos(a)*r;pp[i*3+1]=Math.random()*12;pp[i*3+2]=Math.sin(a)*r;}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({color:0x4db3ff,size:.09,transparent:true,opacity:.6,blending:ADD,depthWrite:false});S.add(new THREE.Points(pg,pm));
/* scan ring + disk */
const scanRing=new THREE.Group();circ(-1.8,0,0,11,96,'xz',M.scan,scanRing);
const disk=new THREE.Mesh(new THREE.CircleGeometry(11,64),FM(0x2a8cff,.1,0));disk.rotation.x=-Math.PI/2;disk.position.x=-1.8;scanRing.add(disk);S.add(scanRing);

/* ---------- timeline ---------- */
const ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x);},sm=(a,b,t)=>ease((t-a)/(b-a));
const PH=[[0,'SCAN INITIALISED'],[.8,'STRUCTURE'],[5,'ENVELOPE AND ROOF'],[7.2,'INTERIOR LAYOUT'],[9.5,'DIMENSIONS'],[12.5,'PROJECTION COMPLETE']];
const phEl=document.getElementById('ph'),tcEl=document.getElementById('tc'),tmEl=document.getElementById('tm'),sc=document.getElementById('sc'),pb=document.getElementById('pp');
const fmt=n=>String(Math.floor(n)).padStart(2,'0');
const tgt=new THREE.Vector3(-1.8,3.4,0);
function frame(t,dt){
 const k=t/T,master=sm(0,.5,t)*(1-sm(14.4,15,t)),fl=Math.random()<.025?.55:1;
 mats.forEach(([m,b])=>{m.opacity=b*master*fl;});
 M.fill.opacity=(.05+.085*sm(7.5,10.5,t)+.01*Math.sin(t*3))*master;
 M.glass.opacity=(.12+.14*sm(7.5,10.5,t))*master;
 M.grid.opacity=master;
 clip.constant=t<.8?0:(t<7.5?9.4*ease((t-.8)/6.7):99);
 const sa=false;scanRing.visible=false;if(sa){scanRing.position.y=clip.constant;}
 E.scale.setScalar(.25+.75*sm(0,2.5,t));E.visible=t>.05;
 M.env.opacity=.7*sm(.3,2.5,t)*master*fl;M.envLo.opacity=.4*sm(.8,3,t)*master;
 M.dim.opacity=.9*sm(9.2,10.4,t)*master;labs.forEach(m=>m.opacity=sm(9.6,10.8,t)*master);
 const a=-1.6+2.3*ease(k)+.15*Math.sin(k*6.28),s=Math.sin(Math.PI*k);
 const r=25-3.5*s;C.position.set(tgt.x+Math.sin(a)*r,4.5+5*s+1.2*ease(k),tgt.z+Math.cos(a)*r);C.lookAt(tgt);
 const p=pg.attributes.position;for(let i=0;i<PN;i++){let y=p.array[i*3+1]+dt*.6;if(y>12)y=0;p.array[i*3+1]=y;}p.needsUpdate=true;
 let ph=PH[0][1];PH.forEach(q=>{if(t>=q[0])ph=q[1];});phEl.textContent=ph;
 tcEl.textContent='00:'+fmt(t)+' / 00:15';tmEl.textContent=t.toFixed(1)+' s';
 R.render(S,C);}
/* ---------- player ---------- */
let t=0,playing=true,last=performance.now(),drag=false;
function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();}
addEventListener('resize',size);size();
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';};
sc.addEventListener('input',()=>{drag=true;t=parseFloat(sc.value);});
sc.addEventListener('change',()=>{drag=false;});
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&!drag){t+=dt;if(t>=T)t-=T;}
 if(!drag)sc.value=t;frame(t,playing?dt:0);requestAnimationFrame(loop);})(last);
})();
</script>
