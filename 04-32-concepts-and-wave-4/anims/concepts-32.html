const lg=(g,x0,y0,x1,y1,st)=>{const r=g.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>r.addColorStop(i/(st.length-1),s));return r};

const rr=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
const rot=(v,T,t)=>{let[x,y,z]=v,a=x*cos(T)+z*sin(T),b=-x*sin(T)+z*cos(T);return[a,y*cos(t)-b*sin(t),y*sin(t)+b*cos(t)]};
const star=(g,c,x,y,r,a)=>{gl(g,c,x,y,r,a);g.globalAlpha=a;g.drawImage(spr(c),x-r*3,y-r*.07,r*6,r*.14);g.drawImage(spr(c),x-r*.07,y-r*3,r*.14,r*6);g.globalAlpha=1};
