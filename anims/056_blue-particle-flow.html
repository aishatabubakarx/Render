<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Particles – 15 s Orbit</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#cfeaff;--dim:#5f86ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid #0e2a45}
canvas{width:100%;height:100%;display:block}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#06192e;color:var(--ink);border:1px solid #1d5f9e;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#0b2a4b}
button:focus-visible,input:focus-visible{outline:2px solid #7fd0ff;outline-offset:2px}
input[type=range]{flex:1;accent-color:#3aa8ff}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
#err{display:none;color:#ff9a9a;padding:20px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <button id="pp" aria-label="Play or pause">Pause</button>
  <input id="sc" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline">
  <span id="tm">0.0 s</span>
</div>
<div id="err">WebGL is not available in this browser, so the animation cannot render.</div>
<script src="../vendor/three.min.js"></script>
<script>
(function(){
const T=15,TAU=Math.PI*2,stage=document.getElementById('stage');
let R;try{R=new THREE.WebGLRenderer({antialias:true});}catch(e){document.getElementById('err').style.display='block';return;}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x000000,1);stage.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(38,16/9,.1,300);

/* the same particle cloud used in the house video: 320 blue points in a disc of radius 15, rising through 12 units */
let s=11;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const N=320,y0=new Float32Array(N),pos=new Float32Array(N*3),bx=new Float32Array(N),bz=new Float32Array(N),sa=new Float32Array(N),sn=new Float32Array(N),sp=new Float32Array(N);
for(let i=0;i<N;i++){const a=rnd()*TAU,r=Math.sqrt(rnd())*15;pos[i*3]=Math.cos(a)*r;pos[i*3+2]=Math.sin(a)*r;y0[i]=rnd()*12;bx[i]=pos[i*3];bz[i]=pos[i*3+2];sa[i]=.3+rnd()*1.2;sn[i]=1+Math.floor(rnd()*3);sp[i]=rnd()*TAU;}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
S.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x4db3ff,size:.09,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false})));

const tgt=new THREE.Vector3(0,6,0);
function frame(t){
 const k=t/T,p=geo.attributes.position;
 for(let i=0;i<N;i++){const w=TAU*k*sn[i]+sp[i];p.array[i*3]=bx[i]+sa[i]*Math.sin(w);p.array[i*3+1]=(y0[i]+.8*t)%12;p.array[i*3+2]=bz[i]+sa[i]*Math.cos(w);}   // 12 units per 15 s, so it loops cleanly
 p.needsUpdate=true;
 const a=-1.6+TAU*k;                                     // one full orbit per loop
 C.position.set(0,6,22);C.lookAt(tgt);
 R.render(S,C);}

function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();}
addEventListener('resize',size);size();
const pb=document.getElementById('pp'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
let t=0,playing=true,last=performance.now(),drag=false;
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';};
sc.addEventListener('input',()=>{drag=true;t=parseFloat(sc.value);});
sc.addEventListener('change',()=>{drag=false;});
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&!drag){t+=dt;if(t>=T)t-=T;}
 if(!drag)sc.value=t;tm.textContent=t.toFixed(1)+' s';frame(t);requestAnimationFrame(loop);})(last);
})();
</script>
</body>
</html>
