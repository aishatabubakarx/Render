html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,sans-serif}
header{padding:18px 16px 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--border)}
h1{margin:0;font-size:20px;letter-spacing:-0.02em}
p.s{margin:4px 0 0;color:var(--mut);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--accent)}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding:16px}

.c canvas{width:100%;display:block;aspect-ratio:16/9;background:#000}
.c div{padding:9px 11px}
.c b{display:block;font-size:13.5px;margin-bottom:2px}
.c span{color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between}
#m{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:16px;box-sizing:border-box}

</style>

const g=document.getElementById('g'),m=document.getElementById('m'),mc=m.querySelector('canvas'),mi=document.getElementById('m-info'),qIn=document.getElementById('q'),catSel=document.getElementById('cat');
const cats=[...new Set(SC.map(s=>s[1]))].sort();
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o)});

const cs=[];
SC.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='c';
  d.dataset.name=s[0].toLowerCase();
  d.dataset.cat=s[1];
  d.innerHTML=`<canvas width="384" height="216"></canvas><div><b>#${String(i+1).padStart(3,'0')}  ${s[0]}</b><span><em>${s[1]}</em><em>${s[2]}s loop</em></span></div>`;
  g.appendChild(d);
  const cv=d.querySelector('canvas');
  cs.push({el:d,s,cv,x:cv.getContext('2d')});
  d.onclick=()=>{m.style.display='flex';m.cur=cs[i];mi.innerHTML=`<strong>#${String(i+1).padStart(3,'0')} ${s[0]}</strong> <span>${s[1]} · ${s[2]}s seamless loop</span>`};
});

function filter(){
  const q=qIn.value.toLowerCase(),cat=catSel.value;
  cs.forEach(o=>{
    const show=(!q||o.el.dataset.name.includes(q)||o.el.dataset.cat.toLowerCase().includes(q))&&(!cat||o.el.dataset.cat===cat);
    o.el.style.display=show?'':'none';
  });
}
qIn.oninput=filter;catSel.onchange=filter;
document.getElementById('th').onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
};
m.onclick=()=>{m.style.display='none';m.cur=null};
addEventListener('keydown',e=>{if(e.key==='Escape'){m.style.display='none';m.cur=null}});

const mx=mc.getContext('2d');
function dr(cv,x,s,t){
  const k=cv.width/160;
  x.setTransform(k,0,0,k,0,0);
  x.save();x.shadowBlur=0;x.globalAlpha=1;x.textAlign='left';
  try{s[3](x,(t%s[2])/s[2])}catch(e){}
  if(!s[4]){
    const v=x.createRadialGradient(80,45,38,80,45,102);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.28)');
    x.fillStyle=v;x.fillRect(0,0,160,90);
  }
  x.restore();
}

let N=12,last=performance.now();
(function L(){
  const n=performance.now(),dt=n-last;last=n;
  N=dt>38?M.max(4,N-1):dt<22?M.min(18,N+.25):N;
  const t=n/1000,h=innerHeight;
  if(m.cur)dr(mc,mx,m.cur.s,t);
  else{
    const v=[];
    cs.forEach(o=>{
      if(o.el.style.display==='none')return;
      const r=o.cv.getBoundingClientRect();
      if(r.bottom>0&&r.top<h){o.d=M.abs(r.top+r.height/2-h/2);v.push(o)}
    });
    v.sort((a,b)=>a.d-b.d);
    v.forEach((o,i)=>{
      if(i<M.floor(N)){o.p=1;dr(o.cv,o.x,o.s,t)}
      else if(!o.p){o.p=1;dr(o.cv,o.x,o.s,o.s[2]*.35)}
    });
  }
  requestAnimationFrame(L);
})();
</script>
