<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple Leaf Burst Loop</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const BASE=[[0,-100],[9,-78],[16,-84],[17,-60],[27,-67],[21,-36],[37,-48],[39,-62],[50,-58],[66,-78],[62,-50],[76,-46],[48,-26],[70,-28],[92,-18],[78,-2],[90,12],[62,10],[46,22],[58,46],[30,34],[12,30],[6,52],[3,70]];
// build one leaf outline with natural asymmetry and serrated edges
function outline(seed){
  const r=rng(seed);
  const side=(sgn)=>BASE.map((p,i)=>{
    if(i===0)return[0,-100+(r()-.5)*3];
    if(i===BASE.length-1)return[3,70];
    return[p[0]+(r()-.5)*7,p[1]+(r()-.5)*7];
  });
  const Rr=side(1),Ll=side(-1);
  const half=(arr,sgn)=>{
    const out=[];
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1];
      out.push(a);
      const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
      if(len>16&&i>0&&i<arr.length-3){
        // outward normal for clockwise outline on right side
        const nx=dy/len,ny=-dx/len;
        const n=Math.floor(len/9);
        for(let k=1;k<=n;k++){
          const t=(k-.35)/(n+.1);
          const off=2.4+r()*2.2;
          out.push([a[0]+dx*t+nx*off,a[1]+dy*t+ny*off]);
          out.push([a[0]+dx*(t+.5/(n+.1))-nx*.8,a[1]+dy*(t+.5/(n+.1))-ny*.8]);
        }
      }
    }
    out.push(arr[arr.length-1]);
    return out.map(p=>[p[0]*sgn,p[1]]);
  };
  const right=half(Rr,1),left=half(Ll,-1);
  return right.concat(left.slice(1,-1).reverse());
}
function tracePath(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();}
// pre-render one leaf sprite: size S, centred, 1 unit = S/260 px
function makeSprite(mk,seed,pal,S){
  const c=mk(S,S),ctx=c.getContext('2d'),k=S/260;
  const pts=outline(seed),r=rng(seed*7+3);
  ctx.translate(S/2,S/2-4*k);ctx.scale(k,k);
  ctx.lineJoin='round';ctx.lineCap='round';
  // stem
  ctx.strokeStyle=pal.stem;ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(0,60);ctx.quadraticCurveTo(r()*8-4,90,r()*10-5,114);ctx.stroke();
  // body gradient: warm centre to darker rim
  const g=ctx.createRadialGradient(0,25,6,0,-10,120);
  g.addColorStop(0,pal.a);g.addColorStop(.5,pal.b);g.addColorStop(1,pal.c);
  ctx.fillStyle=g;tracePath(ctx,pts);ctx.fill();
  ctx.save();tracePath(ctx,pts);ctx.clip();
  // soft mottled colour patches (natural uneven autumn colouring)
  for(let i=0;i<9;i++){
    const x=(r()-.5)*150,y=-70+r()*140,rad=18+r()*28;
    const gg=ctx.createRadialGradient(x,y,0,x,y,rad);
    const col=r()<.5?pal.hi:pal.lo;
    gg.addColorStop(0,col);gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=.35;ctx.fillStyle=gg;ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  ctx.globalAlpha=1;
  // veins: main lobes with curved laterals and fine branches
  const V=[[0,70,0,-96,0],[0,-18,-60,-76,-12],[0,-18,60,-76,12],[0,12,-88,-16,-10],[0,12,88,-16,10],[0,38,-48,40,-6],[0,38,48,40,6]];
  V.forEach((v,i)=>{
    const [x0,y0,x1,y1,bend]=v,mx=(x0+x1)/2+bend,my=(y0+y1)/2;
    // raised highlight along vein (light band) then thin dark groove
    ctx.strokeStyle=pal.vein;ctx.globalAlpha=.07;ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(mx,my,x1,y1);ctx.stroke();
    ctx.globalAlpha=.55;ctx.lineWidth=i?1.6:2.2;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(mx,my,x1,y1);ctx.stroke();
    // fine side branches
    if(i>0)for(let t=.25;t<.9;t+=.2){
      const px=(1-t)*(1-t)*x0+2*(1-t)*t*mx+t*t*x1,py=(1-t)*(1-t)*y0+2*(1-t)*t*my+t*t*y1;
      const dir=x1<0?-1:1;
      ctx.globalAlpha=.45;ctx.lineWidth=.9;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+dir*10,py-12);ctx.moveTo(px,py);ctx.lineTo(px+dir*14,py+6);ctx.stroke();
    }
  });
  ctx.restore();
  // crisp darker rim
  ctx.globalAlpha=.9;ctx.strokeStyle=pal.rim;ctx.lineWidth=2.2;tracePath(ctx,pts);ctx.stroke();
  // silhouette for flip shading
  const d=mk(S,S),dc=d.getContext('2d');
  dc.translate(S/2,S/2-4*k);dc.scale(k,k);dc.fillStyle='#000';tracePath(dc,pts);dc.fill();
  return {img:c,dark:d};
}
const PALS=[
 {a:'#f0552e',b:'#c8301c',c:'#8a1a10',hi:'#ff9a4a',lo:'#7a0f0c',vein:'#ffd8a0',rim:'#5e0f0a',stem:'#6a3a1a'},
 {a:'#f7842f',b:'#dc5a1c',c:'#9a3212',hi:'#ffc060',lo:'#8a2410',vein:'#ffe2a8',rim:'#6a2008',stem:'#6a3a1a'},
 {a:'#f8b236',b:'#e48a22',c:'#a85a14',hi:'#ffe070',lo:'#b0481a',vein:'#fff0b8',rim:'#7a3c0c',stem:'#6a4a1a'},
 {a:'#e0402a',b:'#b02418',c:'#6e0f0f',hi:'#ff7a50',lo:'#4a0808',vein:'#ffb890',rim:'#450808',stem:'#5a2a14'},
 {a:'#d9a02c',b:'#c06a22',c:'#8a3a16',hi:'#e8d060',lo:'#8a5a1a',vein:'#f5e0a0',rim:'#5a2a0c',stem:'#6a4a1a'}
];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

const S=256,mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const sprites=[];
for(let p=0;p<PALS.length;p++)for(let v=0;v<4;v++)sprites.push(makeSprite(mk,31+p*17+v*5,PALS[p],S));

const rand=rng(77),T=6,leaves=[];
const BURSTS=[{ph:0,n:46},{ph:.31,n:36},{ph:.63,n:42}];
BURSTS.forEach(B=>{
  B.ox=(rand()-.5)*.14;B.oy=(rand()-.5)*.14;
  B.cl=[rand()*6.28,rand()*6.28,rand()*6.28];
  for(let i=0;i<B.n;i++){
    const z=Math.pow(rand(),1.5),g=(rand()+rand()+rand()-1.5)*.9;
    leaves.push({
      ox:B.ox,oy:B.oy,z,
      ang:rand()<.65?B.cl[Math.floor(rand()*3)]+g:rand()*6.28,
      ph:B.ph+rand()*.14,kk:rand()<.28?2:1,
      spd:.75+rand()*.6+z*.3,size:.22+z*.95,
      spin:(rand()<.5?-1:1)*(.15+rand()*2.2),rot0:rand()*6.28,
      flip:rand()<.25?0:1+Math.floor(rand()*5),flip0:rand()*6.28,
      swirl:(rand()-.5)*1.2,sag:rand(),wob:1+Math.floor(rand()*3),wamp:rand(),wph:rand()*6.28,
      sp:Math.floor(rand()*sprites.length)
    });
  }
});
const ease=x=>1-Math.pow(1-x,3);

function frame(ms){
  const t=ms/1000;
  ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const unit=Math.min(W,H)/800;
  for(const l of leaves){
    const p=(((t/T)*l.kk)+l.ph)%1,e=ease(p),a=l.ang+l.swirl*e;
    const x0=W/2+l.ox*W,y0=H/2+l.oy*H,c=Math.cos(a),sn=Math.sin(a);
    const ex=c>0?(W-x0)/(c+1e-4):x0/(-c+1e-4),ey=sn>0?(H-y0)/(sn+1e-4):y0/(-sn+1e-4);
    const exitD=Math.min(ex,ey)+140;
    const f=1.2*(.6*p+.4*(1-(1-p)*(1-p)));
    const d=exitD*f*l.spd;
    const wob=Math.sin(p*6.2832*l.wob+l.wph)*l.wamp*40*unit*Math.min(1,p*3);
    const x=x0+c*d-sn*wob,y=y0+sn*d+c*wob+l.sag*p*p*H*.12;
    const alpha=Math.min(1,p/.05)*Math.min(1,(1-p)/.3)*(.6+.4*l.z);
    if(alpha<=.01)continue;
    const s=l.size*unit*(.5+e*.6);
    const fx=Math.cos(l.flip0+l.flip*6.2832*p);
    const ax=l.flip?Math.max(.14,Math.abs(fx))*(fx<0?-1:1):1;
    const sp=sprites[l.sp];
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(l.rot0+l.spin*e*3+Math.sin(p*6.2832+l.wph)*.3);
    ctx.scale(s*ax,s);
    ctx.globalAlpha=alpha;
    ctx.drawImage(sp.img,-S/2,-S/2);
    if(l.flip){ctx.globalAlpha=alpha*(1-Math.abs(fx))*.5;ctx.drawImage(sp.dark,-S/2,-S/2);}
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
