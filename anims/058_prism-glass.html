<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Glass – 15 s Loop</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#cfeaff;--dim:#5f86ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid #0e2a45}
canvas{width:100%;height:100%;display:block}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#06192e;color:var(--ink);border:1px solid #1d5f9e;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#0b2a4b}
button:focus-visible,input:focus-visible{outline:2px solid #7fd0ff;outline-offset:2px}
input[type=range]{flex:1;accent-color:#3aa8ff}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
#err{display:none;color:#ff9a9a;padding:20px;max-width:1280px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="bar">
  <button id="pp" aria-label="Play or pause">Pause</button>
  <input id="sc" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline">
  <span id="tm">0.0 s</span>
</div>
<div id="err"></div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;uniform float uU;
const float TAU=6.2831853;
vec3 pal(float v){vec3 c=.5+.5*cos(TAU*(v+vec3(0.,.33,.67)));return pow(c,vec3(1.4))*1.35;}

/* fluted glass: every colour channel bends by a different amount, so neighbouring colours fan apart and pull back together */
vec3 glass(float h,float lens,float str){
 return vec3(pal(h+lens*str*.55).r,pal(h+lens*str).g,pal(h+lens*str*1.45).b);}
vec3 shade(vec3 c,float f){
 float e=smoothstep(0.,.1,min(f,1.-f)),m=pow(1.-abs(f-.5)*2.,8.);
 return c*(.5+.5*e)+vec3(m*.22)+c*m*.4;}

void main(){
 vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;float u=uU,ph=TAU*u,aa=1.5/uRes.y;
 float rot=u*TAU/6.,cr=cos(rot),sr=sin(rot);p=mat2(cr,-sr,sr,cr)*p;      // 60 degrees per loop = seamless, the form is 6-fold symmetric
 float seg=TAU/6.,r=length(p),a=atan(p.y,p.x);
 float af=abs(mod(a,seg)-seg*.5);                                          // fold into one mirrored wedge
 vec2 q=r*vec2(cos(af),sin(af));
 float R=.3+.012*sin(ph*3.),C=.2+.01*sin(ph*2.);
 float mOut=smoothstep(aa,-aa,q.x-R)*smoothstep(-aa,aa,q.x-(C+.012));    // outer faceted ring
 float mCore=smoothstep(aa,-aa,q.x-C);                                     // inner core, a thin black gap between
 /* outer ring: ribs run along the edge */
 float f1=fract(q.y*58.),l1=f1-.5,s1=.9+.7*sin(ph*2.+q.x*8.);
 float h1=q.x*7.+q.y*2.+.5*sin(q.y*16.+ph*2.)+u;
 vec3 c1=shade(glass(h1,l1,s1),f1);
 /* core: ribs run in rings */
 float f2=fract(q.x*64.),l2=f2-.5,s2=.9+.7*sin(ph*2.+3.+q.y*9.);
 float h2=q.y*6.-q.x*4.+.5*sin(q.x*20.-ph)+u;
 vec3 c2=shade(glass(h2,l2,s2),f2);
 vec3 col=c1*mOut+c2*mCore;
 float inside=clamp(mOut+mCore,0.,1.);
 float seam=exp(-pow((seg*.5-af)*r/.003,2.));                              // cut facet lines
 col+=vec3(seam*.35)*inside;
 col+=pal(af*3.+u)*exp(-max(q.x-R,0.)*22.)*.1*(1.-inside);                // faint halo
 col=1.-exp(-col*1.4);
 gl_FragColor=vec4(col,1.);
}
</script>
<script>
(function(){
const T=15,cv=document.getElementById('cv'),stage=document.getElementById('stage'),err=document.getElementById('err');
const gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
function fail(m){err.style.display='block';err.textContent=m;}
if(!gl){fail('WebGL is not available in this browser, so the animation cannot render.');return;}
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){fail('Shader error:\n'+gl.getShaderInfoLog(s));throw 0;}return s;}
let pr;try{
 pr=gl.createProgram();
 gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
 gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
 gl.linkProgram(pr);}catch(e){return;}
gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(pr,'uRes'),uU=gl.getUniformLocation(pr,'uU');
function size(){const d=Math.min(devicePixelRatio||1,1.5);cv.width=Math.round(stage.clientWidth*d);cv.height=Math.round(stage.clientHeight*d);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uRes,cv.width,cv.height);}
addEventListener('resize',size);size();
const pb=document.getElementById('pp'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
let t=0,playing=true,last=performance.now(),drag=false;
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';};
sc.addEventListener('input',()=>{drag=true;t=parseFloat(sc.value);});
sc.addEventListener('change',()=>{drag=false;});
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&!drag){t+=dt;if(t>=T)t-=T;}
 if(!drag)sc.value=t;tm.textContent=t.toFixed(1)+' s';
 gl.uniform1f(uU,t/T);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop);})(last);
})();
</script>
</body>
</html>
