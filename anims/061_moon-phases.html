<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Phases – 15 s Loop</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#cfeaff;--dim:#5f86ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid #0e2a45}
canvas{width:100%;height:100%;display:block}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#06192e;color:var(--ink);border:1px solid #1d5f9e;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#0b2a4b}
button:focus-visible,input:focus-visible{outline:2px solid #7fd0ff;outline-offset:2px}
input[type=range]{flex:1;accent-color:#3aa8ff}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
#err{display:none;color:#ff9a9a;padding:20px;max-width:1280px;white-space:pre-wrap}
.lab,#big{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.lab{top:89%;font-size:clamp(8px,1.45vw,17px);color:#5f7f9f;letter-spacing:.04em;transition:color .25s,text-shadow .25s}
.lab.on{color:#fff;text-shadow:0 0 10px #6cc0ff}
#big{left:50%;top:65.5%;display:flex;flex-direction:column;gap:2px}
#bn{font-size:clamp(14px,2.6vw,30px);font-weight:600;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px #6cc0ff}
#bi{font-size:clamp(10px,1.6vw,19px);color:#8fb5d9}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="big"><b id="bn">Full Moon</b><span id="bi">100% lit</span></div><div id="labs"></div></div>
<div class="bar">
  <button id="pp" aria-label="Play or pause">Pause</button>
  <input id="sc" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline">
  <span id="tm">0.0 s</span>
</div>
<div id="err"></div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;uniform float uU;                                          // uU = phase angle: 0 new, PI full
const float TAU=6.2831853,PI=3.14159265;
float hh(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(hh(i),hh(i+vec3(1.,0.,0.)),f.x),mix(hh(i+vec3(0.,1.,0.)),hh(i+vec3(1.,1.,0.)),f.x),f.y),
            mix(mix(hh(i+vec3(0.,0.,1.)),hh(i+vec3(1.,0.,1.)),f.x),mix(hh(i+vec3(0.,1.,1.)),hh(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}

/* a lit sphere: q is the position inside a unit disc, phi is where the sun sits around the moon */
vec4 moon(vec2 q,float phi,float detail,float aa){
 float r=length(q);if(r>1.+aa)return vec4(0.);
 float z=sqrt(max(1.-r*r,0.));vec3 N=vec3(q,z);
 vec3 sun=vec3(sin(phi),0.,-cos(phi));
 float ndl=dot(N,sun),lit=smoothstep(-.03,.06,ndl);                          // soft terminator
 vec3 P=N*1.9;
 float mar=smoothstep(.46,.60,fbm(P));                                        // dark seas
 float alb=mix(.95,.42,mar)*(.85+.3*fbm(P*6.));
 if(detail>.5){vec2 g=N.xy*8.,fl=floor(g),fr=fract(g);float cr=0.;                // craters
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 o=vec2(float(i),float(j)),id=fl+o;
   vec2 h=vec2(hh(vec3(id,1.)),hh(vec3(id,2.)));float rad=.2+.25*hh(vec3(id,3.)),d=length(fr-o-h)/rad,on=step(.35,hh(vec3(id,4.)));
   cr+=on*(-.12*smoothstep(1.,.2,d)+.1*smoothstep(.75,1.,d)*smoothstep(1.3,1.,d));}
  alb+=cr;}
 float shade=pow(max(ndl,0.),.4);
 vec3 col=vec3(1.,.97,.92)*alb*(shade*lit*1.25)+vec3(.55,.7,1.)*alb*.04;     // faint earthshine on the dark side
 return vec4(col,smoothstep(1.+aa,1.-aa,r));}

void main(){
 vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;float aa=1.5/uRes.y;
 float illum=.5*(1.-cos(uU));
 vec3 col=vec3(0.);
 /* the big moon */
 vec2 bc=vec2(0.,.15);float br=.27;vec2 q=(p-bc)/br;
 vec4 m=moon(q,uU,1.,aa/br);
 col=mix(col,m.rgb,m.a);
 col+=vec3(.5,.65,1.)*exp(-max(length(q)-1.,0.)*3.5)*.1*(.3+.7*illum)*(1.-m.a);
 /* eight phases underneath: new, waxing crescent, first quarter, waxing gibbous, full, waning gibbous, last quarter, waning crescent */
 for(int k=0;k<8;k++){
  float fk=float(k),pk=fk*PI/4.;
  float dp=abs(mod(uU-pk+PI,TAU)-PI)/(PI/4.);
  float act=1.-smoothstep(.25,.6,dp);                                        // 1 when the big moon shows this phase
  vec2 c=vec2((fk-3.5)*.2,-.31);float sr=.055*(1.+.15*act);
  vec2 qq=(p-c)/sr;float L=length(qq);
  vec4 mk=moon(qq,pk,0.,aa/sr);
  vec3 mc=mk.rgb*(.55+.45*act);
  col=mix(col,mc,mk.a);
  float ring=smoothstep(.05,0.,abs(L-1.4))*act;
  col+=vec3(.6,.82,1.)*(ring+exp(-abs(L-1.4)*5.)*.28*act);
 }
 col=1.-exp(-col*1.5);
 gl_FragColor=vec4(col,1.);
}
</script>
<script>
(function(){
const T=15,cv=document.getElementById('cv'),stage=document.getElementById('stage'),err=document.getElementById('err');
const gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
function fail(m){err.style.display='block';err.textContent=m;}
if(!gl){fail('WebGL is not available in this browser, so the animation cannot render.');return;}
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){fail('Shader error:\n'+gl.getShaderInfoLog(s));throw 0;}return s;}
let pr;try{
 pr=gl.createProgram();
 gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
 gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
 gl.linkProgram(pr);}catch(e){return;}
gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(pr,'uRes'),uU=gl.getUniformLocation(pr,'uU');
function size(){const d=Math.min(devicePixelRatio||1,1.5);cv.width=Math.round(stage.clientWidth*d);cv.height=Math.round(stage.clientHeight*d);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uRes,cv.width,cv.height);}
addEventListener('resize',size);size();
const NM=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
const labsEl=document.getElementById('labs'),bn=document.getElementById('bn'),bi=document.getElementById('bi'),LB=[];
NM.forEach((n,k)=>{const d=document.createElement('div');d.className='lab';d.textContent=n;d.style.left=(50+((k-3.5)*.2)/(.8889*2)*100)+'%';labsEl.appendChild(d);LB.push(d);});
let lastK=-1;
function upd(phi){const k=Math.round(phi/(Math.PI/4))%8,il=Math.round(50*(1-Math.cos(phi))*2)/2*1;
 bi.textContent=Math.round(50*(1-Math.cos(phi)))+'% lit · day '+(phi/6.2831853*29.53).toFixed(1);
 if(k!==lastK){lastK=k;bn.textContent=NM[k];LB.forEach((d,i)=>d.classList.toggle('on',i===k));}}
const pb=document.getElementById('pp'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
let t=0,playing=true,last=performance.now(),drag=false;
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';};
sc.addEventListener('input',()=>{drag=true;t=parseFloat(sc.value);});
sc.addEventListener('change',()=>{drag=false;});
(function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&!drag){t+=dt;if(t>=T)t-=T;}
 if(!drag)sc.value=t;tm.textContent=t.toFixed(1)+' s';
 const phi=(Math.PI+6.2831853*t/T)%6.2831853;gl.uniform1f(uU,phi);upd(phi);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop);})(last);
})();
</script>
</body>
</html>
