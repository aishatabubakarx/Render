<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Concepts 15s</title>
<style>
  :root { color-scheme: light; --fg: #55607a; --line: rgba(60,70,110,.25); }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - 64px); display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; min-height: 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
         padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); color: var(--fg); font-size: 13px; background: #fff; }
  button { background: #fff; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button.on { border-color: #ffb400; color: #c98a00; }
  .track { flex: 1 1 120px; min-width: 90px; height: 2px; background: var(--line); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #ffb400; }
  #title { position: fixed; top: 10px; left: 14px; color: var(--fg); font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<div id="title"></div>
<svg id="s" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="haloY"><stop offset="0" stop-color="#FFF6CC"/><stop offset=".7" stop-color="#FFF3BF"/><stop offset="1" stop-color="#FFF3BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloP"><stop offset="0" stop-color="#FFE9F1"/><stop offset=".7" stop-color="#FFE0EC"/><stop offset="1" stop-color="#FFE0EC" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloG"><stop offset="0" stop-color="#F1FBDD"/><stop offset=".7" stop-color="#E4F6C9"/><stop offset="1" stop-color="#E4F6C9" stop-opacity="0"/></radialGradient>
    <radialGradient id="glassY" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#FFEE9A"/><stop offset=".55" stop-color="#FFD23F"/><stop offset="1" stop-color="#FFB300"/></radialGradient>
    <radialGradient id="glassP" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#FFC2D6"/><stop offset=".55" stop-color="#FF7FA6"/><stop offset="1" stop-color="#F0508A"/></radialGradient>
  </defs>
  <g id="root"></g>
</svg>
<div class="bar">
  <span id="tabs" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <button id="pp">Pause</button>
  <button id="rs">Restart</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="tm">0.0 / 15.0 s</span>
</div>
<script>
(function () {
  var DUR = 15, TAU = Math.PI * 2, NS = 'http://www.w3.org/2000/svg', sin = Math.sin, abs = Math.abs;
  var $ = function (id) { return document.getElementById(id); };
  var cl = function (x) { return Math.min(1, Math.max(0, x)); };
  var eio = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var eout = function (x) { return 1 - Math.pow(1 - x, 3); };
  var ein = function (x) { return x * x * x; };
  var eback = function (x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  function env(t, a, d, b, e) { return Math.max(0.0001, eback(cl((t - a) / d)) * (1 - ein(cl((t - b) / e)))); }
  function tf(el, x, y, s, r, sy) {
    el.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ') rotate(' + (r || 0).toFixed(2) + ') scale(' + s.toFixed(4) + ' ' + (sy === undefined ? s : sy).toFixed(4) + ')');
    el.setAttribute('opacity', s < 0.003 ? 0 : 1);
  }
  function bump(t, a, d) { return Math.sin(Math.PI * cl((t - a) / d)); }

  // ---------- shared parts ----------
  function blob(cx, cy, rx, ry, seed) {
    var n = 8, pts = [], s = seed, i;
    function r() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for (i = 0; i < n; i++) { var a = i / n * TAU, k = 0.82 + 0.3 * r(); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    var d = 'M' + pts[0][0] + ' ' + pts[0][1];
    for (i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ' C ' + (p1[0] + (p2[0] - p0[0]) / 6) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6) + ' ' + (p2[0] - (p3[0] - p1[0]) / 6) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6) + ' ' + p2[0] + ' ' + p2[1];
    }
    return d + 'Z';
  }
  function bgM(k, list) { return '<g data-k="' + k + '">' + list.map(function (l) { return '<path d="' + blob(l[0], l[1], l[2], l[3], l[4]) + '" fill="' + l[5] + '"/>'; }).join('') + '</g>'; }
  function cloudM(k, c) { return '<g data-k="' + k + '"><ellipse rx="36" ry="11" fill="' + c + '"/><circle cx="-9" cy="-9" r="12" fill="' + c + '"/><circle cx="10" cy="-6" r="9" fill="' + c + '"/></g>'; }
  function sparkM(k, c) { return '<path data-k="' + k + '" d="M0 -9 Q1.7 -1.7 9 0 Q1.7 1.7 0 9 Q-1.7 1.7 -9 0 Q-1.7 -1.7 0 -9Z" fill="' + c + '"/>'; }
  function sparks(pre, cols) { var o = ''; for (var i = 0; i < 8; i++) o += sparkM(pre + i, cols[i % cols.length]); return o; }
  function gearPath(R, teeth, fill) {
    var d = '', n = teeth * 4;
    for (var i = 0; i < n; i++) { var a = i / n * TAU, rr = (i % 4 < 2) ? R : R * 0.8; d += (i ? ' L ' : 'M ') + (Math.cos(a) * rr).toFixed(2) + ' ' + (Math.sin(a) * rr).toFixed(2); }
    var h = R * 0.36;
    return '<path fill-rule="evenodd" fill="' + fill + '" d="' + d + ' Z M ' + h + ' 0 A ' + h + ' ' + h + ' 0 1 0 ' + (-h) + ' 0 A ' + h + ' ' + h + ' 0 1 0 ' + h + ' 0 Z"/>';
  }
  function gearM(k, R, n, c) { return '<g data-k="' + k + '">' + gearPath(R, n, c) + '</g>'; }
  var PD = 'M -22 -22 H -6 a 6 6 0 1 1 12 0 H 22 V -6 a 6 6 0 1 1 0 12 V 22 H -22 Z';
  function pieceM(k, c, f) { return '<g data-k="' + k + '"><g transform="scale(' + f + ')"><path d="' + PD + '" fill="' + c + '"/><path d="M -22 22 V -22 H -10" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/></g></g>'; }
  function leafM(k, cols, spread) {
    var out = '';
    for (var i = 0; i < 7; i++) { var ang = -spread + i * (2 * spread / 6), len = 0.8 + 0.5 * abs(sin(i * 2.1)); out += '<path transform="rotate(' + ang.toFixed(1) + ') scale(' + (0.7 * len).toFixed(2) + ' ' + len.toFixed(2) + ')" d="M0 0 C 11 -20 11 -52 0 -74 C -11 -52 -11 -20 0 0Z" fill="' + cols[i % cols.length] + '"/>'; }
    return '<g data-k="' + k + '">' + out + '</g>';
  }
  function haloM(k, g, r) { return '<g data-k="' + k + '"><circle r="' + r + '" fill="url(#' + g + ')"/></g>'; }
  function raysM(k, col) {
    var o = '';
    for (var i = 0; i < 16; i++) { var a = i / 16 * TAU, r2 = i % 2 ? 126 : 140; o += '<line x1="' + (Math.cos(a) * 108).toFixed(1) + '" y1="' + (Math.sin(a) * 108).toFixed(1) + '" x2="' + (Math.cos(a) * r2).toFixed(1) + '" y2="' + (Math.sin(a) * r2).toFixed(1) + '" stroke="' + col + '" stroke-width="5" stroke-linecap="round"/>'; }
    return '<g data-k="' + k + '">' + o + '</g>';
  }
  function bulbM(k, g) {
    var G = 'M -50 54.5 A 74 74 0 1 1 50 54.5 C 42 70 38 80 34 90 L -34 90 C -38 80 -42 70 -50 54.5 Z', F = 'M -16 90 L -16 40 Q -8 22 0 42 Q 8 22 16 40 L 16 90';
    return '<g data-k="' + k + '"><path d="' + G + '" fill="#E6EBF6"/><path data-k="' + k + 'On" d="' + G + '" fill="url(#' + g + ')" opacity="0"/>' +
      '<path d="' + F + '" fill="none" stroke="#B8C0D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path data-k="' + k + 'F" d="' + F + '" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>' +
      '<path d="M -52 -22 A 58 58 0 0 1 -18 -56" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75"/><circle cx="-56" cy="-8" r="3.5" fill="#fff" opacity=".75"/>' +
      '<rect x="-32" y="90" width="64" height="24" rx="5" fill="#9AA5BF"/><line x1="-32" y1="98" x2="32" y2="98" stroke="#7F8AA7" stroke-width="3"/><line x1="-32" y1="106" x2="32" y2="106" stroke="#7F8AA7" stroke-width="3"/>' +
      '<path d="M -22 114 H 22 Q 22 128 0 128 Q -22 128 -22 114 Z" fill="#6C7794"/></g>';
  }
  function lit(R, k, v) { R[k + 'On'].setAttribute('opacity', v); R[k + 'F'].setAttribute('opacity', v); }
  function shM(x, y, rx) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="6" fill="#E8EAF5"/>'; }

  // person with sleeves, bent elbows and hands with a thumb (and an index finger for pointing)
  function armM(k, sx, o, point) {
    var thx = sx > 0 ? -3.4 : 3.4;
    return '<g transform="translate(' + sx + ' -98)"><g data-k="' + k + '">' +
      '<path d="M -4.9 0 C -5.3 -6 -4.5 -12 -3.9 -17 L 3.9 -17 C 4.5 -12 5.3 -6 4.9 0 Z" fill="' + o.shirt + '"/><circle r="5.2" fill="' + o.shirt + '"/>' +
      '<g data-k="' + k + 'e" transform="translate(0 -17)"><circle r="3.9" fill="' + o.shirt + '"/>' +
      '<path d="M -3.6 0 C -3.4 -6 -3 -11 -2.6 -15.5 L 2.6 -15.5 C 3 -11 3.4 -6 3.6 0 Z" fill="' + o.skin + '"/>' +
      '<g transform="translate(0 -17)"><ellipse rx="3.5" ry="4" fill="' + o.skin + '"/><ellipse cx="' + thx + '" cy="1" rx="1.5" ry="2.5" transform="rotate(' + (sx > 0 ? -20 : 20) + ' ' + thx + ' 1)" fill="' + o.skin + '"/>' +
      (point ? '<rect x="-1" y="-9" width="2" height="6.5" rx="1" fill="' + o.skin + '"/>' : '') + '</g></g></g></g>';
  }
  function P(o) {
    var s = o.s;
    var hair = o.pony
      ? '<path d="M -11 -126 C -25 -128 -27 -106 -18 -98 C -18 -110 -14 -117 -11 -121Z" fill="' + o.hair + '"/><path d="M -13 -123 C -14 -140 14 -140 13 -123 C 9 -131 -5 -131 -13 -123 Z" fill="' + o.hair + '"/><ellipse cx="-11" cy="-118" rx="3.6" ry="8" fill="' + o.hair + '"/>'
      : '<path d="M -12.5 -123 C -15 -143 15 -143 12.5 -123 C 8 -134 -6 -134 -12.5 -123 Z" fill="' + o.hair + '"/>';
    var legs = o.legs === false ? '' :
      '<rect x="-10" y="-58" width="8" height="58" rx="3" fill="' + o.pants + '"/><rect x="2" y="-58" width="8" height="58" rx="3" fill="' + o.pants + '"/><ellipse cx="-7" cy="1" rx="8" ry="3.4" fill="' + o.shoe + '"/><ellipse cx="7" cy="1" rx="8" ry="3.4" fill="' + o.shoe + '"/>';
    return '<g data-k="' + o.k + '">' + legs +
      '<rect x="-16" y="-104" width="32" height="52" rx="12" fill="' + o.shirt + '"/><rect x="-4" y="-113" width="8" height="11" rx="3" fill="' + o.skin + '"/><circle cx="0" cy="-122" r="12" fill="' + o.skin + '"/>' + hair +
      armM(o.k + 'H', -s * 14, o, false) + armM(o.k + 'A', s * 14, o, o.point !== false) + '</g>';
  }
  var WOMAN = { shirt: '#F36C8C', pants: '#2B2D5B', hair: '#6B3E2E', skin: '#F2C2A1', shoe: '#2B2D5B', pony: true };
  var MAN = { shirt: '#2BB3A0', pants: '#2B2D5B', hair: '#3B2A25', skin: '#C98B65', shoe: '#1B1D3F', pony: false };
  var WOMAN2 = { shirt: '#7A6CF0', pants: '#3C3F73', hair: '#2E2A3A', skin: '#E6A97F', shoe: '#2B2D5B', pony: true };
  var MAN2 = { shirt: '#FF8A3D', pants: '#3C3F73', hair: '#8A5A2B', skin: '#F2C2A1', shoe: '#2B2D5B', pony: false };
  function mix(base, extra) { var o = {}, k; for (k in base) o[k] = base[k]; for (k in extra) o[k] = extra[k]; return o; }
  // angles are clockwise from straight up, mirrored for the side the arm is on; bend turns the forearm
  function arm(R, k, w, s, ang, bend) {
    var sg = w === 'A' ? s : -s;
    R[k + w].setAttribute('transform', 'rotate(' + (sg * ang).toFixed(1) + ')');
    R[k + w + 'e'].setAttribute('transform', 'translate(0 -17) rotate(' + (sg * bend).toFixed(1) + ')');
  }
  function hang(R, k, s, t, u, ph) { arm(R, k, 'H', s, 172 + 3 * sin(2 * u + ph), -8); }
  function place(R, k, x, y, t, i, o, ph, amp) { tf(R[k], x, y + (amp === undefined ? 1.5 : amp) * sin(TAU * 2 * t / DUR + (ph || 0)), env(t, i, 0.9, o, 1.0), 0); }

  // ---------- scene factory ----------
  var root = $('root'), scenes = [];
  function scene(name, html, init) {
    var g = document.createElementNS(NS, 'g'); g.innerHTML = html; g.style.display = 'none'; root.appendChild(g);
    var R = {}; Array.prototype.forEach.call(g.querySelectorAll('[data-k]'), function (el) { R[el.getAttribute('data-k')] = el; });
    scenes.push({ name: name, g: g, upd: init(R) });
  }
  function common(R, t, u, bgx, bgy) {
    tf(R.bg, bgx, bgy, env(t, 0, 0.9, 13.6, 1.0) * (1 + 0.02 * sin(2 * u)), 0);
    tf(R.c1, 150 + 30 * sin(u), 70, env(t, 0.3, 0.8, 13.8, 0.9), 0);
    tf(R.c2, 640 + 26 * sin(u + 1.7), 95, env(t, 0.5, 0.8, 13.7, 0.9), 0);
  }
  function sparkTick(R, t, u, on, pos) {
    for (var m = 0; m < 8; m++) {
      var s = Math.pow(Math.max(0, sin(TAU * (pos[m][2] * t / DUR + m * 0.13))), 2) * on;
      tf(R['sk' + m], pos[m][0], pos[m][1], s * 1.1, 45 * s);
    }
  }
  var plants = function (a, b) { return leafM('plL', ['#3DBE8B', '#1F9E75', '#8BD9A8', '#F7A8BC'], 52) + leafM('plR', ['#8BD9A8', '#3DBE8B', '#1F9E75', '#FFD27A'], 50); };
  function plantTick(R, t, u, xl, xr) {
    tf(R.plL, xl, 490, env(t, 0.5, 0.9, 13.5, 1.0), 3 * sin(2 * u));
    tf(R.plR, xr, 490, env(t, 0.6, 0.9, 13.4, 1.0), 3 * sin(2 * u + 1.6));
  }
  var BASEBG = bgM('bg', [[0, -20, 330, 215, 11, '#F1F0FF'], [220, 100, 150, 105, 23, '#FFE9EE'], [-220, 60, 150, 100, 37, '#E6F0FF']]);
  var CLOUDS = cloudM('c1', '#FFE1E8') + cloudM('c2', '#DDE8FF');

  // ===== 1. Mind and gears =====
  var HEAD = 'M -30 150 L -26 112 C -62 100 -96 70 -106 30 C -126 -20 -112 -88 -66 -122 C -22 -156 44 -152 84 -118 C 112 -92 122 -58 122 -30 L 140 6 C 144 12 140 18 132 19 L 126 21 C 128 31 126 38 120 42 C 124 52 118 62 106 66 C 108 78 100 88 84 90 L 78 100 C 74 116 62 124 46 126 L 46 150 Z';
  scene('Mind and gears',
    BASEBG + CLOUDS + plants() + shM(390, 432, 90) + shM(160, 490, 46) + shM(640, 490, 46) +
    '<g data-k="head"><rect x="-56" y="146" width="130" height="22" rx="8" fill="#B9B2FF"/><path d="' + HEAD + '" fill="#8F86F5"/><circle cx="-8" cy="-40" r="82" fill="#CFC9FF"/>' +
      '<circle data-k="bglow" cx="40" cy="-14" r="40" fill="#FFE58A" opacity="0"/>' +
      '<g data-k="g1">' + gearPath(30, 12, '#FFB38A') + '</g><g data-k="g2">' + gearPath(20, 8, '#F36C8C') + '</g><g data-k="g3">' + gearPath(12, 6, '#FFC21F') + '</g>' +
      '<path data-k="bolt" d="M 38 -52 L 16 -8 H 34 L 24 30 L 54 -20 H 36 L 48 -52 Z" fill="#FFC21F" opacity="0"/></g>' +
    '<circle data-k="d1" r="6" fill="#CFC9FF"/><circle data-k="d2" r="9" fill="#CFC9FF"/><circle data-k="d3" r="13" fill="#CFC9FF"/>' +
    '<g data-k="qb"><circle r="40" fill="#7A6CF0"/><text data-k="qq" text-anchor="middle" y="13" font-size="40" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">?</text><text data-k="qe" text-anchor="middle" y="13" font-size="40" font-weight="700" fill="#FFE58A" font-family="system-ui,sans-serif" opacity="0">!</text></g>' +
    P(mix(WOMAN, { k: 'p1', s: 1 })) + P(mix(MAN, { k: 'p2', s: -1, point: false })) + sparks('sk', ['#FFC21F', '#F36C8C', '#7A6CF0', '#2BB3A0']),
    function (R) {
      var sp = [[300, 100, 3], [500, 95, 2], [120, 330, 4], [690, 300, 2], [250, 250, 3], [560, 330, 4], [95, 120, 3], [715, 170, 2]];
      return function (t, u) {
        common(R, t, u, 400, 280);
        tf(R.head, 390, 250 + 4 * sin(2 * u), env(t, 0.4, 1.0, 13.4, 1.1), 0);
        tf(R.g1, -48, -48, 1, 720 * t / DUR); tf(R.g2, 2, -48, 1, -1080 * t / DUR + 15); tf(R.g3, -30, -4, 1, -1440 * t / DUR);
        var on = eio(cl((t - 2.2) / 0.6)) * (1 - eio(cl((t - 13) / 0.8))), fl = 0.65 + 0.35 * Math.pow(Math.max(0, sin(6 * u)), 2);
        R.bolt.setAttribute('opacity', on * fl); R.bglow.setAttribute('opacity', on * 0.7 * fl);
        for (var i = 1; i <= 3; i++) tf(R['d' + i], 520 + i * 32, 190 - i * 36 + 4 * sin(2 * u + i), env(t, 2.6 + i * 0.4, 0.5, 11.5, 0.8), 0);
        tf(R.qb, 640, 120 + 5 * sin(2 * u), env(t, 3.8, 0.7, 11.5, 0.8) , 0);
        var sw = eio(cl((t - 6.2) / 0.5)); R.qq.setAttribute('opacity', 1 - sw); R.qe.setAttribute('opacity', sw);
        place(R, 'p1', 160, 490, t, 0.7, 13.3, 0); place(R, 'p2', 640, 490, t, 0.95, 13.1, 1.4);
        var a1 = eio(cl((t - 2.0) / 0.9)) * (1 - eio(cl((t - 12.8) / 0.9)));
        arm(R, 'p1', 'A', 1, 168 + (80 - 168) * a1 + 6 * sin(3 * u) * a1, 8 + (-28 - 8) * a1); hang(R, 'p1', 1, t, u, 0);
        var a2 = eio(cl((t - 2.4) / 0.9)) * (1 - eio(cl((t - 12.8) / 0.9)));
        arm(R, 'p2', 'A', -1, 168 + (150 - 168) * a2, 8 + (-130 - 8) * a2 + 6 * sin(2 * u) * a2); hang(R, 'p2', -1, t, u, 1);
        plantTick(R, t, u, 90, 725); sparkTick(R, t, u, on, sp);
      };
    });

  // ===== 2. Presentation =====
  var C2 = 2 * Math.PI * 15, slices = [[0.4, 0, '#F36C8C'], [0.35, 0.4, '#2BB3A0'], [0.25, 0.75, '#FFC21F']];
  var pie = slices.map(function (s, i) { return '<circle data-k="pie' + i + '" r="15" fill="none" stroke="' + s[2] + '" stroke-width="30" stroke-dasharray="0 ' + C2 + '" stroke-dashoffset="' + (-s[1] * C2) + '" transform="rotate(-90)"/>'; }).join('');
  var bars2 = [40, 62, 86, 110].map(function (h, i) { return '<rect data-k="b' + i + '" x="' + (10 + i * 40) + '" y="0" width="26" height="0" rx="4" fill="' + ['#2BB3A0', '#F36C8C', '#FFC21F', '#7A6CF0'][i] + '"/>'; }).join('');
  scene('Presentation',
    BASEBG + CLOUDS + plants() + shM(330, 490, 46) +
    '<g data-k="board"><rect x="-170" y="-100" width="340" height="200" rx="14" fill="#fff" stroke="#E1E6F7" stroke-width="2"/><path d="M -170 -86 a 14 14 0 0 1 14 -14 H 156 a 14 14 0 0 1 14 14 V -78 H -170 Z" fill="#EEF1FF"/>' +
      '<circle cx="-155" cy="-89" r="3.5" fill="#F36C8C"/><circle cx="-145" cy="-89" r="3.5" fill="#FFC21F"/><circle cx="-135" cy="-89" r="3.5" fill="#2BB3A0"/>' +
      '<g transform="translate(-95 -5)">' + pie + '</g><line x1="0" y1="72" x2="160" y2="72" stroke="#D7DDF0" stroke-width="2"/><g transform="translate(0 72)">' + bars2 + '</g>' +
      '<path data-k="trend" d="M 8 30 L 50 8 L 90 -2 L 130 -36 L 152 -50" fill="none" stroke="#2B2D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-k="thead" d="M 152 -50 L 141 -49 M 152 -50 L 150 -39" fill="none" stroke="#2B2D5B" stroke-width="4" stroke-linecap="round"/></g>' +

    scenes[cur].g.style.display = 'none'; cur = i; scenes[cur].g.style.display = ''; tNow = 0;
    Array.prototype.forEach.call(tabs.children, function (b, k) { b.className = k === i ? 'on' : ''; });
    title.textContent = (i + 1) + ' / ' + scenes.length + '   ' + scenes[i].name;
  }
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { tNow += dt; if (tNow >= DUR) tNow = tNow % DUR; }
    scenes[cur].upd(tNow, TAU * tNow / DUR);
    fill.style.width = (tNow / DUR * 100) + '%'; tm.textContent = tNow.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }
  pp.onclick = function () { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; };
  rs.onclick = function () { tNow = 0; };
  select(0);
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
