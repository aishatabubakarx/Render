<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Clock</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#cfeaff;--dim:#5f86ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;overflow:hidden;border:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
#dg{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:clamp(14px,2.4vw,28px);letter-spacing:.18em;color:#ffd9a0;font-variant-numeric:tabular-nums;text-shadow:0 0 12px #ff9a4a;pointer-events:none}
.bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:14px}
button{background:#1c1208;color:#ffe2b8;border:1px solid #7a5530;padding:8px 18px;font:inherit;font-size:16px;letter-spacing:.08em;cursor:pointer;min-width:84px}
button:hover{background:#2c1c0e}
button:focus-visible,input:focus-visible{outline:2px solid #ffcf70;outline-offset:2px}
input[type=range]{flex:1;accent-color:#e0a24a}
#tm{font-variant-numeric:tabular-nums;color:#9a7a55;min-width:84px;text-align:right}
#err{display:none;color:#ff9a9a;padding:20px}
</style>
</head>
<body>
<div id="stage"></div>

<div id="err">WebGL is not available in this browser, so the clock cannot render.</div>
<script src="../vendor/three.min.js"></script>
<script>
(function(){
const TAU=Math.PI*2,stage=document.getElementById('stage');
let R;try{R=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){document.getElementById('err').style.display='block';return;}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x000000,0);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;R.outputEncoding=THREE.sRGBEncoding;
stage.insertBefore(R.domElement,stage.firstChild);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(32,16/9,.1,50);

/* studio reflections: a dark gradient room with three soft boxes, baked into an environment map */
{const es=new THREE.Scene(),gc=document.createElement('canvas');gc.width=4;gc.height=256;const gx=gc.getContext('2d'),gr=gx.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#ffd9a8');gr.addColorStop(.5,'#5a3322');gr.addColorStop(1,'#140a08');gx.fillStyle=gr;gx.fillRect(0,0,4,256);
 es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gc),side:THREE.BackSide})));
 [[-20,18,25,14,6],[22,8,18,6,10],[0,-22,15,18,3]].forEach(a=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(a[3],a[4]),new THREE.MeshBasicMaterial({color:new THREE.Color(5,5,5),side:THREE.DoubleSide}));p.position.set(a[0],a[1],a[2]);p.lookAt(0,0,0);es.add(p);});
 S.environment=new THREE.PMREMGenerator(R).fromScene(es,.02).texture;}

S.add(new THREE.AmbientLight(0xffe9d0,.3));
const key=new THREE.DirectionalLight(0xfff0d8,1.6);key.position.set(-2,3,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-1.3,right:1.3,top:1.3,bottom:-1.3,near:.5,far:12});key.shadow.bias=-.0004;key.shadow.normalBias=.02;S.add(key);
const rim=new THREE.DirectionalLight(0xff9a6a,1.0);rim.position.set(3,-1,-2);S.add(rim);

const steel=new THREE.MeshStandardMaterial({color:0xf2cf94,metalness:1,roughness:.2}),
 dark=new THREE.MeshStandardMaterial({color:0xa8764c,metalness:1,roughness:.35}),
 gold=new THREE.MeshStandardMaterial({color:0xffcf70,metalness:1,roughness:.25});

/* case */
const bez=new THREE.Mesh(new THREE.TorusGeometry(.99,.07,32,160),steel);bez.position.z=.06;S.add(bez);
const out=new THREE.Mesh(new THREE.TorusGeometry(1.07,.025,24,160),dark);out.position.z=-.02;S.add(out);
const body=new THREE.Mesh(new THREE.CylinderGeometry(1.06,1.06,.34,128),dark);body.rotation.x=Math.PI/2;body.position.z=-.2;S.add(body);
const crown=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.16,32),steel);crown.rotation.z=Math.PI/2;crown.position.set(1.12,0,-.08);S.add(crown);

/* dial texture */
const dc=document.createElement('canvas');dc.width=dc.height=1024;const x=dc.getContext('2d'),c0=512,k=545;
{const g=x.createRadialGradient(c0,c0,0,c0,c0,c0);g.addColorStop(0,'#fff7e8');g.addColorStop(1,'#efd7b8');x.fillStyle=g;x.fillRect(0,0,1024,1024);
 
 for(let i=0;i<60;i++){const a=i/60*TAU,r0=i%5?.86:.82;x.strokeStyle=i%5?'#b39a7c':'#6b3f2a';x.lineWidth=i%5?3:6;x.beginPath();x.moveTo(c0+Math.sin(a)*r0*k,c0-Math.cos(a)*r0*k);x.lineTo(c0+Math.sin(a)*.91*k,c0-Math.cos(a)*.91*k);x.stroke();}
 x.fillStyle='#5a3526';x.font='600 84px "Arial Narrow",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';
 for(let i=1;i<=12;i++){const a=i/12*TAU;x.fillText(String(i),c0+Math.sin(a)*.64*k,c0-Math.cos(a)*.64*k+4);}}
const dt=new THREE.CanvasTexture(dc);dt.encoding=THREE.sRGBEncoding;dt.anisotropy=8;
const dial=new THREE.Mesh(new THREE.CircleGeometry(.94,128),new THREE.MeshStandardMaterial({map:dt,roughness:.55,metalness:.25}));dial.receiveShadow=true;S.add(dial);
const IDX=[];for(let i=0;i<12;i++){const a=i/12*TAU,m=new THREE.Mesh(new THREE.BoxGeometry(.035,.1,.02),new THREE.MeshStandardMaterial({color:0xe0a24a,emissive:0x000000,emissiveIntensity:0,metalness:1,roughness:.25}));
 m.position.set(Math.sin(a)*.76,Math.cos(a)*.76,.012);m.rotation.z=-a;m.castShadow=true;S.add(m);IDX.push(m);}

/* glass dome */
let DOME;
{const r=3,th=Math.asin(.95/r),g=new THREE.Mesh(new THREE.SphereGeometry(r,64,16,0,TAU,0,th),new THREE.MeshStandardMaterial({color:0xffffff,metalness:0,roughness:0,transparent:true,opacity:.07,envMapIntensity:1.6}));
 g.rotation.x=Math.PI/2;g.position.z=.06-r*Math.cos(th);S.add(g);DOME=g;}

/* hands */
function hand(len,w,tail,mat,z){const sh=new THREE.Shape();sh.moveTo(-w/2,-tail);sh.lineTo(w/2,-tail);sh.lineTo(w*.35,len*.8);sh.lineTo(0,len);sh.lineTo(-w*.35,len*.8);sh.closePath();
 const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.012,bevelEnabled:true,bevelSize:.004,bevelThickness:.004,bevelSegments:2}),mat);m.position.z=z;m.castShadow=true;
 const g=new THREE.Group();g.add(m);S.add(g);return g;}
const red=new THREE.MeshStandardMaterial({color:0xff6b57,emissive:0xff4a3a,emissiveIntensity:.35,metalness:.5,roughness:.3});
const hH=hand(.5,.075,.09,steel,.03),hM=hand(.8,.05,.11,steel,.05),hS=hand(.88,.012,.13,red,.07);

const cap=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.05,48),gold);cap.rotation.x=Math.PI/2;cap.position.z=.075;cap.castShadow=true;S.add(cap);
const pin=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,.07,24),red);pin.rotation.x=Math.PI/2;pin.position.z=.095;S.add(pin);

/* everything lives in one group so the whole clock can build up and shrink away as one piece */
const G=new THREE.Group();S.children.filter(c=>!c.isLight).forEach(c=>G.add(c));S.add(G);

let uy=0,up=0,drag=false,px=0,py=0;
stage.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;uy+=(e.clientX-px)*.006;up+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;up=Math.max(-1,Math.min(1,up));});
['pointerup','pointercancel'].forEach(n=>stage.addEventListener(n,()=>{drag=false;}));
function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();}
addEventListener('resize',size);size();

/* the story, 15 s: build the clock, wind the hands round to the real time, then let it run, then fold away */
/* a second-hand trail: sixty small lights along the rim glow where the hand just passed and fade behind it */
const TR=[];for(let i=0;i<60;i++){const a=i/60*TAU,m=new THREE.Mesh(new THREE.CircleGeometry(.0125,16),new THREE.MeshBasicMaterial({color:0xb39a7c}));m.position.set(Math.sin(a)*.925,Math.cos(a)*.925,.006);G.add(m);TR.push(m);}
const base=[.70,.60,.49],hot=[1,.42,.34];
function frame(now){
 const d=new Date(),sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()+sec/60,hr=(d.getHours()%12)+min/60;
 const fr=sec%1,ez=fr<.2?1-Math.pow(1-fr/.2,3):1;                       // the second hand ticks, like a real clock
 hS.rotation.z=-TAU*(Math.floor(sec)+ez)/60;hM.rotation.z=-TAU*min/60;hH.rotation.z=-TAU*hr/12;
 TR.forEach((m,i)=>{const age=(Math.floor(sec)-i+60)%60,b=age<10?Math.pow(1-age/10,1.5):0;m.material.color.setRGB(base[0]+(hot[0]-base[0])*b,base[1]+(hot[1]-base[1])*b,base[2]+(hot[2]-base[2])*b);m.scale.setScalar(1+.9*b);});
 const hi=Math.floor(hr)%12;                                              // the current hour marker glows
 IDX.forEach((m,i)=>{const on=i===hi;m.material.emissive.setHex(on?0xff9a2a:0);m.material.emissiveIntensity=on?.8:0;m.scale.setScalar(on?1.3:1);});
 key.position.set(-2+Math.sin(now*.00045)*1.8,3+Math.sin(now*.0003+1)*.8,4);   // light drifts slowly so the gold catches it
 const yaw=.2+uy,pit=.1+up,D=5.4;
 C.position.set(Math.sin(yaw)*Math.cos(pit)*D,Math.sin(pit)*D,Math.cos(yaw)*Math.cos(pit)*D);C.lookAt(0,0,0);
 R.render(S,C);}
(function loop(now){if(!drag){uy*=.985;up*=.985;}frame(now);requestAnimationFrame(loop);})(0);
})();
</script>
</body>
</html>
